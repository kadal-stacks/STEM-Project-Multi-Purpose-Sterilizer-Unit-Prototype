<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Purpose Sterilizer Unit Prototype — concept visual</title>
  <desc id="desc">Dark navy engineering illustration of an enclosed modular treatment chamber with a removable perforated rack, door interlock, low-voltage controller board, and restrained ultraviolet accents contained inside the chamber. This is a concept illustration, not a validated design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.56" stop-color="#101c31"/>
      <stop offset="1" stop-color="#17142c"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52657d"/>
      <stop offset="0.46" stop-color="#24354c"/>
      <stop offset="1" stop-color="#172438"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#192b41"/>
      <stop offset="1" stop-color="#0b1727"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25294b"/>
      <stop offset="1" stop-color="#141d31"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1e8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9b72ff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="uv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d8cff"/>
      <stop offset=".5" stop-color="#d0a3ff"/>
      <stop offset="1" stop-color="#8c7bff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7c8d7"/>
      <stop offset=".4" stop-color="#7891a8"/>
      <stop offset="1" stop-color="#42586f"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d7f78"/>
      <stop offset="1" stop-color="#12434a"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8ab4d3" stroke-opacity=".07" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#7ad5e8" fill-opacity=".15"/>
    </pattern>
    <pattern id="perfs" width="24" height="18" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="5" r="2.2" fill="#0b1725" fill-opacity=".78"/>
      <circle cx="18" cy="14" r="2.2" fill="#0b1725" fill-opacity=".78"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="30" fill="url(#grid)"/>
  <circle cx="1230" cy="260" r="265" fill="#6b53ff" opacity=".07"/>
  <circle cx="405" cy="660" r="250" fill="#23c8dc" opacity=".045"/>
  <path d="M70 158H1530" stroke="#7290af" stroke-opacity=".25"/>
  <path d="M70 790H1530" stroke="#7290af" stroke-opacity=".25"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="92" y="86" fill="#76d8e7" font-size="17" font-weight="700" letter-spacing="4">ENGINEERING CONCEPT / 01</text>
    <text x="90" y="132" fill="#f0f5fc" font-size="38" font-weight="700" letter-spacing=".4">MULTI-PURPOSE STERILIZER UNIT</text>
    <text x="92" y="185" fill="#b5c5d9" font-size="19">Modular chamber • Low-voltage control • Interlocked enclosure</text>

    <g transform="translate(1220 65)">
      <rect width="282" height="42" rx="21" fill="#172e42" stroke="#4d829c" stroke-opacity=".65"/>
      <circle cx="23" cy="21" r="5" fill="#64d7df"/>
      <text x="40" y="27" fill="#d5edf3" font-size="13" font-weight="700" letter-spacing="1.6">PRELIMINARY STUDY</text>
    </g>

    <!-- Main enclosed chamber: top and side faces -->
    <g stroke-linejoin="round">
      <path d="M350 337L704 223L1134 341L771 467Z" fill="#3e536c" stroke="#7f9bb3" stroke-width="2"/>
      <path d="M350 337L771 467L771 692L350 559Z" fill="url(#shell)" stroke="#647e99" stroke-width="2"/>
      <path d="M771 467L1134 341L1134 567L771 692Z" fill="#1b2a3e" stroke="#647e99" stroke-width="2"/>
      <!-- Rear inner cavity -->
      <path d="M422 361L704 274L1059 372L770 474Z" fill="url(#inner)" stroke="#8298b4" stroke-opacity=".8" stroke-width="1.5"/>
      <path d="M422 361L770 474L770 633L422 522Z" fill="#101c30" stroke="#63788f" stroke-width="1.5"/>
      <path d="M770 474L1059 372L1059 530L770 633Z" fill="#121d31" stroke="#63788f" stroke-width="1.5"/>
      <!-- UV tubes retained within the enclosure -->
      <path d="M474 357L713 283L1003 365" stroke="#ab8bff" stroke-opacity=".22" stroke-width="28" fill="none" filter="url(#softGlow)"/>
      <path d="M474 357L713 283L1003 365" stroke="url(#uv)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M485 500L720 578L1019 474" stroke="#ab8bff" stroke-opacity=".20" stroke-width="26" fill="none" filter="url(#softGlow)"/>
      <path d="M485 500L720 578L1019 474" stroke="url(#uv)" stroke-width="8" stroke-linecap="round" fill="none"/>
      <!-- Modular removable perforated rack -->
      <path d="M430 438L767 547L1047 450L710 348Z" fill="url(#metal)" stroke="#c5d3e1" stroke-width="1.5"/>
      <path d="M430 438L767 547L1047 450L710 348Z" fill="url(#perfs)" opacity=".95"/>
      <path d="M460 447L460 469L768 568L768 547" fill="#627c96" stroke="#a2b8ca" stroke-width="1.3"/>
      <path d="M768 547L768 568L1020 481L1020 460" fill="#425d75" stroke="#9bb1c5" stroke-width="1.3"/>
      <path d="M447 431L710 352M507 456L770 377M568 475L831 397M629 496L891 418M690 516L953 439" stroke="#d5e0e8" stroke-opacity=".55" stroke-width="1.2"/>
      <!-- Front edge/base rim -->
      <path d="M350 559L771 692L1134 567" fill="none" stroke="#8ba1b7" stroke-width="3"/>
      <path d="M379 573L379 598L423 612L423 587M717 680L717 704M1082 583L1082 607" fill="none" stroke="#263a51" stroke-width="13" stroke-linecap="round"/>
      <!-- Side controller screen -->
      <path d="M873 548L1074 478L1074 532L873 603Z" fill="#0a1524" stroke="#6d8ca4" stroke-width="2"/>
      <path d="M892 552L1049 497L1049 524L892 579Z" fill="#112e41" stroke="#45c3d8" stroke-opacity=".7"/>
      <path d="M909 559L952 544M909 570L981 545" stroke="#64d8dc" stroke-width="2" stroke-linecap="round"/>
      <circle cx="1030" cy="514" r="4" fill="#70e3c5"/>
      <circle cx="1041" cy="510" r="4" fill="#c49dff"/>
      <!-- Side service panel seams -->
      <path d="M806 491L806 653M1112 376L1112 554" stroke="#6c849d" stroke-opacity=".6" stroke-width="1.2"/>
      <circle cx="1102" cy="395" r="4" fill="#8fa5b8"/>
      <circle cx="1102" cy="543" r="4" fill="#8fa5b8"/>
    </g>

    <!-- Front access door, shown closed -->
    <g>
      <path d="M285 347L605 244L605 503L285 606Z" fill="url(#face)" stroke="#8ba3b9" stroke-width="3"/>
      <path d="M302 365L588 273L588 486L302 579Z" fill="url(#glass)" stroke="#507086" stroke-width="1.5"/>
      <path d="M318 381L573 299L573 470L318 552Z" fill="#081525" fill-opacity=".48" stroke="#7c8ea6" stroke-opacity=".5"/>
      <path d="M342 402L548 336L548 458L342 525Z" fill="#6e63c8" fill-opacity=".06" stroke="#8274d0" stroke-opacity=".32" stroke-width="1.2"/>
      <path d="M366 420L526 369" stroke="#b097ff" stroke-opacity=".5" stroke-width="2"/>
      <path d="M367 436L526 385" stroke="#b097ff" stroke-opacity=".25" stroke-width="2"/>
      <path d="M563 422L584 415L584 448L563 455Z" fill="#9baec3" stroke="#d2deea" stroke-width="1.2"/>
      <path d="M567 428L579 424L579 440L567 444Z" fill="#172538"/>
      <!-- Interlock sensor -->
      <rect x="300" y="588" width="42" height="15" rx="3" fill="#50c6d8" transform="rotate(-18 300 588)"/>
      <path d="M296 602L329 592" stroke="#a2e8ef" stroke-width="2"/>
    </g>

    <!-- Controller board -->
    <g transform="translate(1160 462)">
      <path d="M0 48L187 0L312 42L124 95Z" fill="#070f1c" opacity=".55"/>
      <path d="M0 22L180 -24L306 19L125 66Z" fill="url(#pcb)" stroke="#63c7b9" stroke-width="1.5"/>
      <path d="M17 23L57 12L89 23L49 34ZM221 16L259 6L282 14L243 25Z" fill="#b7a16a" opacity=".85"/>
      <path d="M58 12L58 -8M73 17L73 -2M88 23L88 4M104 28L104 9M122 33L122 15M139 29L139 10M153 25L153 6M168 20L168 2" stroke="#b5b17c" stroke-width="2" opacity=".7"/>
      <path d="M132 29L132 42L162 49M185 18L185 35L212 44M42 21L42 42L67 48" fill="none" stroke="#9bdac9" stroke-width="2" stroke-opacity=".85"/>
      <path d="M107 5L153 -7L181 2L135 14Z" fill="#1b2537" stroke="#6bd0c2" stroke-width="1.5"/>
      <path d="M126 8L160 0" stroke="#9caec0" stroke-width="1.4"/>
      <!-- Header pins -->
      <path d="M13 16L14 4M25 13L26 1M37 10L38 -2M49 7L50 -5" stroke="#d1d6d8" stroke-width="2.4"/>
      <circle cx="20" cy="31" r="3" fill="#d7e6d9"/><circle cx="284" cy="24" r="3" fill="#d7e6d9"/>
    </g>

    <!-- Callout labels and leaders -->
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <path d="M398 626L330 691L178 691" fill="none" stroke="#6bcfdd" stroke-width="1.6"/>
      <circle cx="398" cy="626" r="4" fill="#6bcfdd"/>
      <text x="92" y="680" fill="#72d9e5" font-size="14" font-weight="700" letter-spacing="1.8">01 / ACCESS DOOR</text>
      <text x="92" y="707" fill="#b4c5d9" font-size="17">Closed enclosure concept</text>

      <path d="M824 556L875 630L1028 630" fill="none" stroke="#9b8cff" stroke-width="1.6"/>
      <circle cx="824" cy="556" r="4" fill="#ad9bff"/>
      <text x="874" y="620" fill="#b5a6ff" font-size="14" font-weight="700" letter-spacing="1.8">02 / REMOVABLE RACK</text>
      <text x="874" y="647" fill="#b4c5d9" font-size="17">Modular tray concept</text>

      <path d="M1347 510L1403 569L1480 569" fill="none" stroke="#65d8c7" stroke-width="1.6"/>
      <circle cx="1347" cy="510" r="4" fill="#65d8c7"/>
      <text x="1280" y="600" fill="#75e2d1" font-size="14" font-weight="700" letter-spacing="1.8">03 / CONTROL</text>
      <text x="1280" y="627" fill="#b4c5d9" font-size="17">Separate low-voltage subsystem</text>

      <g transform="translate(90 824)">
        <rect width="318" height="34" rx="17" fill="#1a2c40" stroke="#66829a" stroke-opacity=".6"/>
        <text x="18" y="22" fill="#d7e2ed" font-size="12" font-weight="700" letter-spacing="1.3">CONCEPT VISUAL • NOT A BUILD DRAWING</text>
      </g>
      <text x="1510" y="844" text-anchor="end" fill="#8498af" font-size="13">EDUCATIONAL PROTOTYPE / DESIGN STUDY</text>
    </g>
  </g>
</svg>