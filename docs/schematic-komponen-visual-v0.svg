<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
<title id="title">Visual wiring diagram with electronic components</title>
<desc id="desc">Manual SVG drawing of the low voltage control subsystem with 5 V isolated adapter, MCU on matrix board, LCD I2C through JST-XH-4, NC door switch through JST-XH-2, and alternate relay module or discrete MOSFET relay driver.</desc>
<defs>
<style>
.bg{fill:#f3f6fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.dark{fill:#14253a}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.pcb{fill:#176c62;stroke:#0c514a;stroke-width:2}.chip{fill:#1b2736;stroke:#0b1320;stroke-width:2}.pin{fill:#d4b36a;stroke:#8b6e30;stroke-width:1}.title{font:700 32px Inter,Arial,sans-serif;fill:#fff}.subtitle{font:16px Inter,Arial,sans-serif;fill:#cad8e7}.head{font:700 20px Inter,Arial,sans-serif;fill:#102238}.label{font:700 15px Inter,Arial,sans-serif;fill:#11263c}.txt{font:14px Inter,Arial,sans-serif;fill:#30445a}.sm{font:12px Inter,Arial,sans-serif;fill:#52677e}.tiny{font:11px Inter,Arial,sans-serif;fill:#52677e}.red{fill:none;stroke:#d94841;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.black{fill:none;stroke:#344256;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.green{fill:none;stroke:#13876b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.blue{fill:none;stroke:#3678d4;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:#bd861c;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#71869c;stroke-width:1.5}.warn{fill:#fff7ed;stroke:#e48a48;stroke-width:1.5}.dash{fill:none;stroke:#8a9bae;stroke-width:2;stroke-dasharray:7 6}.white{fill:#fff}.chiptext{font:700 12px Inter,Arial,sans-serif;fill:#e5edf5}
</style>
<pattern id="holes" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="3" fill="#cad5df" stroke="#8ea0b1" stroke-width=".7"/></pattern>
<linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#142c3c"/><stop offset="1" stop-color="#071a25"/></linearGradient>
</defs>
<rect width="1800" height="1180" class="bg"/>
<rect width="1800" height="145" class="dark"/>
<text x="58" y="57" class="title">MULTI-PURPOSE STERILIZER UNIT</text>
<text x="60" y="88" class="subtitle">Visual wiring reference · component-level draft v0.1 · low-voltage control only</text>
<rect x="1400" y="35" width="335" height="53" rx="9" fill="#203b56" stroke="#4b6d8c"/>
<text x="1567" y="57" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">COMPONENT VIEW</text>
<text x="1567" y="76" text-anchor="middle" font-family="Arial" font-size="12" fill="#cad8e7">Not a final PCB layout</text>

<!-- Main wiring panel -->
<rect x="40" y="170" width="1720" height="555" rx="16" class="panel"/>
<text x="68" y="210" class="head">1. Rangkaian kontrol dan sambungan eksternal</text>
<text x="68" y="235" class="sm">Catu 5 V DC terisolasi. Semua konektor JST-XH pada gambar ini hanya untuk tegangan rendah.</text>

<!-- Adapter -->
<g>
<rect x="70" y="292" width="205" height="137" rx="13" fill="#e1e8ef" stroke="#8295a7" stroke-width="2"/>
<rect x="89" y="309" width="167" height="61" rx="7" fill="#203449"/>
<text x="172" y="336" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#f3f7fb">5 V DC</text>
<text x="172" y="355" text-anchor="middle" font-family="Arial" font-size="11" fill="#c4d3e1">ISOLATED ADAPTER</text>
<path d="M105 391 H140 M204 391 H239" stroke="#8798a8" stroke-width="5" stroke-linecap="round"/>
<text x="172" y="415" text-anchor="middle" class="sm">power supply</text>
<text x="172" y="452" text-anchor="middle" class="label">Adaptor low-voltage</text>
</g>

<!-- JST XH2 power connector -->
<g>
<rect x="320" y="313" width="133" height="96" rx="9" class="card"/>
<rect x="339" y="326" width="95" height="44" rx="4" fill="#efe6cf" stroke="#a18b60" stroke-width="1.5"/>
<rect x="351" y="337" width="18" height="22" rx="2" fill="#b18c43"/><rect x="404" y="337" width="18" height="22" rx="2" fill="#b18c43"/>
<circle cx="360" cy="348" r="4" fill="#fff7db"/><circle cx="413" cy="348" r="4" fill="#fff7db"/>
<text x="386" y="390" text-anchor="middle" class="label">J1 · XH-2</text>
<text x="386" y="405" text-anchor="middle" class="tiny">5 V input</text>
</g>
<path d="M275 345 H320" class="red"/><path d="M275 390 H299 V438 H320" class="black"/>
<text x="280" y="331" class="tiny" fill="#d94841">+5 V</text><text x="280" y="430" class="tiny">GND</text>

<!-- Matrix board -->
<g>
<rect x="500" y="274" width="462" height="389" rx="10" class="pcb"/>
<rect x="515" y="289" width="432" height="357" rx="5" fill="url(#holes)"/>
<rect x="535" y="302" width="390" height="53" rx="5" fill="#0e5049" stroke="#72c9b2" stroke-opacity=".7"/>
<text x="730" y="326" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#effffb">MATRIX / PERFBOARD</text>
<text x="730" y="343" text-anchor="middle" font-family="Arial" font-size="11" fill="#c8ede4">Control circuit · keep mains off this board</text>
<!-- MCU IC -->
<rect x="565" y="386" width="196" height="141" rx="6" fill="#dce5ed" stroke="#879bab" stroke-width="1.5"/>
<rect x="592" y="403" width="142" height="105" rx="4" class="chip"/>
<rect x="577" y="415" width="15" height="6" class="pin"/><rect x="577" y="433" width="15" height="6" class="pin"/><rect x="577" y="451" width="15" height="6" class="pin"/><rect x="577" y="469" width="15" height="6" class="pin"/><rect x="577" y="487" width="15" height="6" class="pin"/>
<rect x="734" y="415" width="15" height="6" class="pin"/><rect x="734" y="433" width="15" height="6" class="pin"/><rect x="734" y="451" width="15" height="6" class="pin"/><rect x="734" y="469" width="15" height="6" class="pin"/><rect x="734" y="487" width="15" height="6" class="pin"/>
<text x="663" y="432" text-anchor="middle" class="chiptext">U1</text><text x="663" y="452" text-anchor="middle" class="chiptext">MCU</text><text x="663" y="471" text-anchor="middle" font-family="Arial" font-size="10" fill="#d7e4ef">STC8H1K08</text><text x="663" y="486" text-anchor="middle" font-family="Arial" font-size="10" fill="#d7e4ef">or CH32V003</text>
<text x="663" y="547" text-anchor="middle" class="tiny">Final package / pin map TBD</text>
<!-- Decoupling cap -->
<g transform="translate(795 398)">
<rect x="0" y="0" width="94" height="62" rx="5" fill="#e3ebf2" stroke="#95a7b7"/>
<rect x="25" y="8" width="15" height="45" rx="3" fill="#d1b168" stroke="#907537"/><rect x="54" y="8" width="15" height="45" rx="3" fill="#d1b168" stroke="#907537"/>
<text x="47" y="79" text-anchor="middle" class="tiny">C1 100 nF</text>
</g>
<!-- pins/header -->
<rect x="548" y="577" width="365" height="34" rx="4" fill="#0d4d48" stroke="#82d6c4"/>
<rect x="560" y="584" width="18" height="19" rx="2" class="pin"/><rect x="586" y="584" width="18" height="19" rx="2" class="pin"/><rect x="612" y="584" width="18" height="19" rx="2" class="pin"/><rect x="638" y="584" width="18" height="19" rx="2" class="pin"/><rect x="664" y="584" width="18" height="19" rx="2" class="pin"/><rect x="690" y="584" width="18" height="19" rx="2" class="pin"/><rect x="716" y="584" width="18" height="19" rx="2" class="pin"/><rect x="742" y="584" width="18" height="19" rx="2" class="pin"/><rect x="768" y="584" width="18" height="19" rx="2" class="pin"/><rect x="794" y="584" width="18" height="19" rx="2" class="pin"/><rect x="820" y="584" width="18" height="19" rx="2" class="pin"/><rect x="846" y="584" width="18" height="19" rx="2" class="pin"/><rect x="872" y="584" width="18" height="19" rx="2" class="pin"/>
<text x="730" y="632" text-anchor="middle" font-family="Arial" font-size="11" fill="#e0f6f2">Kawat jumper solder sisi bawah / atas sesuai jalur</text>
</g>
<!-- power wires to matrix -->
<path d="M453 341 H480 V322 H500" class="red"/><path d="M453 384 H476 V440 H500" class="black"/>
<text x="463" y="328" class="tiny" fill="#d94841">+5V</text><text x="458" y="426" class="tiny">GND</text>

<!-- LCD module -->
<g>
<rect x="1075" y="274" width="302" height="190" rx="11" fill="#e2e9f0" stroke="#8498aa" stroke-width="2"/>
<rect x="1094" y="292" width="264" height="101" rx="7" fill="#223749" stroke="#7b8fa2" stroke-width="2"/>
<rect x="1107" y="305" width="238" height="75" rx="3" fill="url(#lcd)" stroke="#4b858c"/>
<text x="1121" y="334" font-family="monospace" font-size="18" fill="#a2f3b8">STERILIZER</text><text x="1121" y="358" font-family="monospace" font-size="14" fill="#a2f3b8">READY / CLOSED</text>
<rect x="1160" y="409" width="132" height="29" rx="4" fill="#d8e2ed" stroke="#8a9caf"/>
<text x="1226" y="428" text-anchor="middle" class="tiny">I²C backpack</text>
<text x="1226" y="488" text-anchor="middle" class="label">LCD 16×2 I²C</text>
</g>
<!-- LCD wire harness -->
<path d="M962 360 H1015 V306 H1075" class="red"/><path d="M962 388 H1030 V325 H1075" class="black"/><path d="M962 416 H1045 V346 H1075" class="green"/><path d="M962 444 H1060 V367 H1075" class="blue"/>
<text x="977" y="295" class="tiny" fill="#d94841">VCC</text><text x="990" y="319" class="tiny">GND</text><text x="1003" y="341" class="tiny" fill="#13876b">SDA</text><text x="1018" y="362" class="tiny" fill="#3678d4">SCL</text>
<!-- J2 pinout card -->
<rect x="1045" y="510" width="375" height="110" rx="8" class="card"/>
<text x="1062" y="535" class="label">J2 · JST-XH-4 / pinout yang dipilih</text><text x="1062" y="560" class="txt">1 VCC · 2 GND · 3 SDA · 4 SCL</text><path d="M1062 576 H1400" class="thin"/><text x="1062" y="599" class="sm">Periksa urutan pin di backpack sebelum crimp/solder.</text>

<!-- door switch -->
<g>
<rect x="1450" y="274" width="260" height="190" rx="11" fill="#e2e9f0" stroke="#8498aa" stroke-width="2"/>
<rect x="1475" y="306" width="105" height="76" rx="7" fill="#344456" stroke="#75889a" stroke-width="1.5"/>
<circle cx="1498" cy="344" r="8" fill="#d4b56c"/><circle cx="1557" cy="344" r="8" fill="#d4b56c"/><path d="M1498 344 L1544 328 L1557 344" stroke="#dce4eb" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M1545 329 L1603 294" stroke="#9baebe" stroke-width="10" stroke-linecap="round"/><circle cx="1607" cy="291" r="11" fill="#d6e0e8" stroke="#7d8e9f" stroke-width="2"/>
<text x="1580" y="410" text-anchor="middle" class="label">Micro limit switch</text><text x="1580" y="430" text-anchor="middle" class="sm">Kontak NC · deteksi pintu</text><text x="1580" y="449" text-anchor="middle" class="tiny">J3 · JST-XH-2</text>
</g>
<rect x="1450" y="510" width="260" height="110" rx="8" class="card"/>
<text x="1467" y="535" class="label">J3 · door status</text><text x="1467" y="560" class="txt">1 DOOR_SENSE</text><text x="1467" y="584" class="txt">2 GND</text><text x="1467" y="606" class="sm">NC closed = LOW; open = HIGH*</text>
<path d="M962 480 H1005 V640 H1450" class="gold"/><path d="M1710 584 H1735 V652 H1450" class="black"/><text x="1080" y="635" class="tiny" fill="#bd861c">DOOR_SENSE · pull-up at MCU</text><text x="1515" y="648" class="tiny">GND return</text>

<!-- legend -->
<rect x="70" y="670" width="890" height="37" rx="7" fill="#f1f5f9" stroke="#d5dee8"/>
<path d="M88 688 H124" class="red"/><text x="132" y="693" class="sm">+5 V</text><path d="M205 688 H241" class="black"/><text x="249" y="693" class="sm">GND</text><path d="M320 688 H356" class="green"/><text x="364" y="693" class="sm">SDA</text><path d="M430 688 H466" class="blue"/><text x="474" y="693" class="sm">SCL</text><path d="M540 688 H576" class="gold"/><text x="584" y="693" class="sm">Door status</text>
<text x="70" y="716" class="tiny">*Sensor wiring is a draft; fail-safe behavior and pull-up configuration must be verified during bench testing.</text>

<!-- Relay driver alternatives -->
<rect x="40" y="750" width="1720" height="385" rx="16" class="panel"/>
<text x="68" y="790" class="head">2. Alternatif driver relay — pilih salah satu</text>
<text x="68" y="815" class="sm">Relay module biasanya sudah memiliki transistor dan diode flyback. MOSFET eksternal hanya diperlukan bila memakai relay polos atau ada kebutuhan interface yang terbukti.</text>

<!-- Option A -->
<rect x="70" y="840" width="790" height="255" rx="11" fill="#effaf6" stroke="#80cbb7" stroke-width="1.5"/>
<rect x="92" y="858" width="110" height="30" rx="15" fill="#d7f4eb" stroke="#70bca8"/><text x="147" y="878" text-anchor="middle" class="label">OPSI A</text><text x="220" y="880" class="head">Modul relay 5 V</text>
<g>
<rect x="95" y="910" width="390" height="137" rx="9" class="pcb"/>
<circle cx="114" cy="929" r="5" fill="#dfc06f"/><circle cx="466" cy="929" r="5" fill="#dfc06f"/><circle cx="114" cy="1028" r="5" fill="#dfc06f"/><circle cx="466" cy="1028" r="5" fill="#dfc06f"/>
<rect x="137" y="929" width="130" height="95" rx="8" fill="#273e56" stroke="#8aa0b3" stroke-width="1.5"/><text x="202" y="967" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#e4edf5">RELAY</text><text x="202" y="988" text-anchor="middle" font-family="Arial" font-size="12" fill="#c0d0df">5 V COIL</text><text x="202" y="1007" text-anchor="middle" font-family="Arial" font-size="11" fill="#c0d0df">K1</text>
<rect x="294" y="936" width="68" height="68" rx="5" fill="#162637" stroke="#91a4b6"/><text x="328" y="965" text-anchor="middle" font-family="Arial" font-size="11" fill="#eff6fb">DRIVER</text><text x="328" y="982" text-anchor="middle" font-family="Arial" font-size="11" fill="#eff6fb">+ DIODE</text>
<rect x="380" y="940" width="90" height="27" rx="4" fill="#d6b76d" stroke="#80672e"/><text x="425" y="958" text-anchor="middle" class="tiny">COM/NO/NC</text><rect x="380" y="978" width="90" height="27" rx="4" fill="#d6b76d" stroke="#80672e"/><text x="425" y="996" text-anchor="middle" class="tiny">VCC/GND/IN</text>
</g>
<text x="520" y="925" class="label">J4 · XH-3 (opsional)</text><text x="520" y="950" class="txt">1 +5 V · 2 GND · 3 RELAY_CMD</text><text x="520" y="978" class="sm">Periksa active-HIGH/LOW dan</text><text x="520" y="997" class="sm">keadaan OFF ketika MCU reset.</text><text x="520" y="1030" class="sm">Driver bawaan cukup jika sudah</text><text x="520" y="1049" class="sm">memenuhi input MCU dan koil.</text><text x="95" y="1077" class="tiny">Tampilan modul bersifat ilustratif; terminal setiap produk berbeda.</text>

<!-- Option B -->
<rect x="890" y="840" width="840" height="255" rx="11" fill="#eff6ff" stroke="#8ab7ef" stroke-width="1.5"/>
<rect x="912" y="858" width="110" height="30" rx="15" fill="#e0ebfd" stroke="#8ab7ef"/><text x="967" y="878" text-anchor="middle" class="label">OPSI B</text><text x="1040" y="880" class="head">Relay polos + MOSFET</text>
<!-- relay body -->
<rect x="925" y="918" width="203" height="97" rx="9" fill="#dce6ee" stroke="#8499ab" stroke-width="2"/><rect x="940" y="932" width="173" height="69" rx="7" fill="#f8fafc" stroke="#9bacbc"/><text x="1026" y="960" text-anchor="middle" class="label">K1 RELAY</text><text x="1026" y="980" text-anchor="middle" class="txt">5 V DC COIL</text>
<!-- MOSFET TO220 icon -->
<g transform="translate(1170 918)"><path d="M7 0 H104 V17 H7Z" fill="#8696a6" stroke="#586b7c"/><rect x="17" y="12" width="84" height="68" rx="5" fill="#273747" stroke="#101b28" stroke-width="2"/><circle cx="59" cy="11" r="8" fill="#dbe4eb" stroke="#71869c" stroke-width="2"/><rect x="28" y="80" width="6" height="22" class="pin"/><rect x="56" y="80" width="6" height="22" class="pin"/><rect x="84" y="80" width="6" height="22" class="pin"/><text x="59" y="43" text-anchor="middle" font-family="Arial" font-size="12" fill="#edf4fa">Q1</text><text x="59" y="59" text-anchor="middle" font-family="Arial" font-size="10" fill="#c4d4e2">N-MOSFET</text><text x="31" y="116" text-anchor="middle" class="tiny">G</text><text x="59" y="116" text-anchor="middle" class="tiny">D</text><text x="87" y="116" text-anchor="middle" class="tiny">S</text></g>
<!-- discrete components icons -->
<g transform="translate(1320 927)"><rect x="0" y="15" width="95" height="25" rx="12" fill="#2b3541" stroke="#111a25" stroke-width="1.5"/><rect x="65" y="15" width="8" height="25" fill="#bfccd7"/><path d="M-10 27H0M95 27H108" class="thin"/><text x="47" y="59" text-anchor="middle" class="tiny">D1 flyback</text><text x="47" y="75" text-anchor="middle" class="tiny">K toward +5 V</text></g>
<g transform="translate(1460 920)"><path d="M0 25H17M79 25H96" class="thin"/><rect x="17" y="14" width="62" height="22" rx="9" fill="#e5d0a3" stroke="#9f8550"/><path d="M30 15V35M42 15V35M54 15V35M66 15V35" stroke="#b34e42" stroke-width="2"/><text x="48" y="55" text-anchor="middle" class="tiny">Rg 100 Ω</text></g>
<g transform="translate(1460 985)"><path d="M0 25H17M79 25H96" class="thin"/><rect x="17" y="14" width="62" height="22" rx="9" fill="#e5d0a3" stroke="#9f8550"/><path d="M30 15V35M42 15V35M54 15V35M66 15V35" stroke="#b34e42" stroke-width="2"/><text x="48" y="55" text-anchor="middle" class="tiny">Rpd 100 kΩ</text></g>
<text x="925" y="1050" class="sm">MOSFET mengendalikan koil DC saja. D1 paralel koil: katoda ke +5 V, anoda ke drain/koil−.</text><text x="925" y="1072" class="sm">Pilih MOSFET logic-level; verifikasi VGS, RDS(on), arus koil, datasheet dan pinout.</text>

<rect x="70" y="1110" width="1660" height="29" rx="6" class="warn"/><text x="900" y="1130" text-anchor="middle" class="label" fill="#9a3412">PLN / BALLAST / UV-C tidak ditampilkan sebagai jalur kabel. Gunakan enclosure dan interlock fisik independen.</text>
<text x="900" y="1160" text-anchor="middle" class="sm">Ilustrasi komponen digambar manual sebagai referensi visual; pinout final wajib dicocokkan dengan datasheet dan modul yang dibeli.</text>
</svg>