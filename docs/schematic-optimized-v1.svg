<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="t d">
<title id="t">Corrected UV-C sterilizer controller schematic v1.0</title><desc id="d">Manual engineering schematic showing regulated five volt low voltage supply, MCU candidates, LCD I2C through JST-XH-4, monitored door switch, separate normally closed coil inhibit, relay coil with logic-level MOSFET driver and flyback diode, and a separate abstract ballast and two UV-C lamp load subsystem.</desc>
<defs><style>
.bg{fill:#f2f6fb}.headbg{fill:#122238}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.box{fill:#f8fafc;stroke:#9aabbb;stroke-width:1.6}.comp{fill:#f8fafc;stroke:#34495e;stroke-width:2}.chip{fill:#172a3d;stroke:#081626;stroke-width:2}.safe{fill:#ecfdf5;stroke:#36a78e;stroke-width:1.7}.warn{fill:#fff7ed;stroke:#e58b46;stroke-width:1.7}.h1{font:700 29px Inter,Arial,sans-serif;fill:#fff}.sub{font:16px Inter,Arial,sans-serif;fill:#c5d5e5}.sec{font:700 19px Inter,Arial,sans-serif;fill:#102238}.lab{font:700 14px Inter,Arial,sans-serif;fill:#142b42}.tx{font:14px Inter,Arial,sans-serif;fill:#31465b}.sm{font:12px Inter,Arial,sans-serif;fill:#52687d}.tiny{font:11px Inter,Arial,sans-serif;fill:#52687d}.white{fill:#fff}.net{font:700 12px Inter,Arial,sans-serif;fill:#0c7865}.hot{font:700 13px Inter,Arial,sans-serif;fill:#9a3412}.r{fill:none;stroke:#cb433c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.k{fill:none;stroke:#334155;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.g{fill:none;stroke:#12836b;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.b{fill:none;stroke:#3678d4;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.o{fill:none;stroke:#b57f1d;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#8a9bae;stroke-width:2;stroke-dasharray:8 6}.dot{fill:#334155}.conn{fill:#f2ead6;stroke:#a28a5b;stroke-width:1.4}
</style><pattern id="holes" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="2.8" fill="#d0e1db" stroke="#89b4a7" stroke-width=".7"/></pattern><linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#143346"/><stop offset="1" stop-color="#061820"/></linearGradient></defs>
<rect width="1800" height="1240" class="bg"/><rect width="1800" height="118" class="headbg"/>
<text x="50" y="48" class="h1">MULTI-PURPOSE STERILIZER UNIT</text><text x="52" y="80" class="sub">Corrected schematic v1.0 • baseline: two UV-C lamps • 27 Oct 2026</text>
<rect x="1430" y="27" width="320" height="58" rx="9" fill="#213d59" stroke="#557492"/><text x="1590" y="51" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">REVIEW DRAFT</text><text x="1590" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#c9d9e8">Low-voltage detail + load boundary</text>

<rect x="35" y="135" width="1730" height="205" rx="12" class="panel"/>
<text x="60" y="168" class="sec">A. CONTROL POWER — USE REGULATED 5 V DC</text>
<text x="60" y="190" class="sm">Baseline removes LM7805. If the available source is higher DC, use a correctly rated buck converter instead.</text>
<rect x="65" y="219" width="155" height="75" rx="8" fill="#dce5ed" stroke="#8397a9" stroke-width="2"/><rect x="80" y="231" width="125" height="34" rx="5" fill="#263b51"/><text x="142" y="253" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">5 V DC</text><text x="142" y="282" text-anchor="middle" class="sm">isolated adapter</text>
<rect x="262" y="224" width="120" height="65" rx="7" class="conn"/><text x="322" y="246" text-anchor="middle" class="lab">J1 XH-2</text><text x="322" y="266" text-anchor="middle" class="sm">1 +5V / 2 GND</text>
<path d="M220 240 H262" class="r"/><path d="M220 274 H242 V309 H262" class="k"/><text x="229" y="230" class="tiny" fill="#cb433c">+5 V</text><text x="230" y="302" class="tiny">GND</text>
<rect x="420" y="237" width="83" height="39" rx="5" class="comp"/><text x="461" y="253" text-anchor="middle" class="lab">F1</text><text x="461" y="268" text-anchor="middle" class="sm">PTC*</text><path d="M382 240 H420" class="r"/><path d="M503 240 H580" class="r"/><text x="522" y="228" class="net">+5V_CTL</text>
<path d="M585 240 V270 M572 270 H598 M572 278 H598 M585 278 V309" class="k"/><text x="585" y="295" text-anchor="middle" class="tiny">100 nF</text>
<path d="M664 240 V270 M650 270 H678 M650 278 H678 M664 278 V309" class="k"/><text x="664" y="295" text-anchor="middle" class="tiny">47–100 µF</text>
<rect x="730" y="225" width="76" height="30" rx="5" fill="#ead6a6" stroke="#a58a55"/><text x="768" y="244" text-anchor="middle" class="sm">R1 1 kΩ</text><path d="M580 240 H730" class="r"/><path d="M806 240 H839" class="r"/><circle cx="855" cy="240" r="14" fill="#efc2bb" stroke="#bd5145" stroke-width="2"/><path d="M847 232 L863 248 M863 232 L847 248" stroke="#bd5145" stroke-width="2"/><path d="M855 254 V309 H664" class="k"/><text x="855" y="271" text-anchor="middle" class="tiny">LED1</text><text x="855" y="337" text-anchor="middle" class="tiny">power indicator</text>
<rect x="930" y="215" width="790" height="94" rx="8" class="box"/><text x="950" y="240" class="lab">Power notes</text><text x="950" y="263" class="tx">C1 = 100 nF and C2 = 47–100 µF across +5V_CTL/GND near the control board.</text><text x="950" y="285" class="tx">R1 limits LED current; F1 rating is TBD after current budget and adapter are finalized.</text><text x="950" y="307" class="tx">Choose a buck converter if using higher DC input; check linear regulator heating.</text><text x="60" y="324" class="sm">*1 A is a starting supply class, not a final current calculation. Confirm controller, LCD and relay-coil current.</text>

<rect x="35" y="358" width="1730" height="350" rx="12" class="panel"/><text x="60" y="391" class="sec">B. MCU, LCD I²C AND DOOR INPUT</text>
<rect x="65" y="420" width="300" height="235" rx="9" class="pcb"/><rect x="76" y="431" width="278" height="213" rx="5" fill="url(#holes)"/><rect x="105" y="462" width="220" height="105" rx="6" class="chip"/><text x="215" y="486" text-anchor="middle" class="chiptext">U1 · MCU</text><text x="215" y="507" text-anchor="middle" font-family="Arial" font-size="12" fill="#e2ebf4">STC8H1K08 or</text><text x="215" y="525" text-anchor="middle" font-family="Arial" font-size="12" fill="#e2ebf4">CH32V003</text><text x="215" y="546" text-anchor="middle" font-family="Arial" font-size="10" fill="#bfcfdf">select one; pin map TBD</text><text x="215" y="620" text-anchor="middle" class="sm" fill="#e4f4ef">PCB matrix / low-voltage only</text>
<rect x="400" y="425" width="325" height="220" rx="8" class="box"/><text x="420" y="453" class="lab">Net names (not physical pin numbers)</text><line x1="420" y1="463" x2="705" y2="463" class="dash"/><text x="420" y="482" class="tx">VCC → +5V_CTL</text><text x="420" y="508" class="tx">GND → GND</text><text x="420" y="534" class="tx">SDA / SCL ↔ LCD</text><text x="420" y="560" class="tx">DOOR_SENSE ← SW1</text><text x="420" y="586" class="tx">UV_RELAY_CMD → Q1</text><text x="420" y="618" class="sm">C3 100 nF adjacent to MCU supply pins.</text>
<rect x="770" y="423" width="330" height="160" rx="10" fill="#dce5ed" stroke="#8fa1b2" stroke-width="2"/><rect x="787" y="439" width="296" height="100" rx="7" fill="#22384b" stroke="#7890a4"/><rect x="800" y="451" width="270" height="76" rx="3" fill="url(#lcd)" stroke="#4d868c"/><text x="816" y="480" font-family="monospace" font-size="17" fill="#9af2b7">UV-C CONTROLLER</text><text x="816" y="506" font-family="monospace" font-size="14" fill="#9af2b7">DOOR: CLOSED</text><rect x="865" y="548" width="140" height="22" rx="4" fill="#cbd8e4" stroke="#879bad"/><text x="935" y="563" text-anchor="middle" class="tiny">I²C backpack</text><text x="935" y="604" text-anchor="middle" class="lab">LCD 16×2 · J2 XH-4</text><text x="935" y="624" text-anchor="middle" class="sm">1 VCC · 2 GND · 3 SDA · 4 SCL*</text>
<path d="M725 475 H747 V446 H770" class="r"/><path d="M725 505 H752 V458 H770" class="k"/><path d="M725 535 H757 V470 H770" class="g"/><path d="M725 565 H762 V482 H770" class="b"/><text x="732" y="464" class="tiny" fill="#cb433c">+5V</text><text x="734" y="496" class="tiny">GND</text><text x="735" y="526" class="tiny" fill="#13836b">SDA</text><text x="737" y="556" class="tiny" fill="#3678d4">SCL</text>
<rect x="1145" y="423" width="570" height="112" rx="8" class="box"/><text x="1165" y="450" class="lab">SW1 · door-state monitor (NC)</text><text x="1165" y="476" class="tx">+5V_CTL ─ R2 10 kΩ pull-up ─ DOOR_SENSE ─ SW1 NC ─ GND</text><text x="1165" y="500" class="tx">Closed = LOW; open or wire break = HIGH/fault.</text><text x="1165" y="520" class="sm">J3 XH-2: pin 1 DOOR_SENSE, pin 2 GND.</text>
<path d="M1145 477 H1118 V605 H725" class="o"/><text x="1043" y="598" class="tiny" fill="#b57f1d">DOOR_SENSE</text>
<rect x="1145" y="551" width="570" height="96" rx="8" fill="#f8fafc" stroke="#9cb5ca" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1165" y="577" class="lab">J5 · optional temperature / humidity</text><text x="1165" y="600" class="tx">JST-XH-3: +5V · DATA · GND; verify exact sensor and pull-up.</text><text x="1165" y="624" class="sm">Optional only; not in baseline BOM. Heater/fan/valve controls excluded.</text>
<rect x="770" y="643" width="330" height="43" rx="6" class="safe"/><text x="935" y="660" text-anchor="middle" class="sm">5 V logic assumed; level shifter omitted</text><text x="935" y="676" text-anchor="middle" class="tiny">Verify LCD backpack pin order and pull-ups.</text>

<rect x="35" y="727" width="1730" height="310" rx="12" class="panel"/><text x="60" y="762" class="sec">C. RELAY DRIVER + HARDWIRED COIL INHIBIT</text><text x="60" y="783" class="sm">This drawing uses a bare 5 V relay with MOSFET coil driver. A ready-made relay module normally already has a coil driver; do not stack them by default.</text>
<rect x="65" y="804" width="1030" height="205" rx="9" class="safe"/><text x="85" y="830" class="lab">Low-voltage coil circuit</text>
<text x="92" y="872" class="lab" fill="#cb433c">+5V_CTL</text><path d="M165 867 H235" class="r"/><circle cx="235" cy="867" r="4" class="dot"/><circle cx="308" cy="867" r="4" class="dot"/><path d="M235 867 L296 848" class="k"/><path d="M308 867 H365" class="r"/><text x="270" y="839" text-anchor="middle" class="sm">SW2 NC</text><text x="270" y="854" text-anchor="middle" class="tiny">limit switch</text>
<rect x="365" y="846" width="150" height="42" rx="20" class="comp"/><text x="440" y="872" text-anchor="middle" class="lab">K1 coil · 5 V</text><path d="M515 867 H566 V926 H617" class="r"/>
<path d="M365 867 V912 H386" class="k"/><rect x="386" y="896" width="140" height="32" rx="5" class="comp"/><text x="456" y="909" text-anchor="middle" class="sm">D1 · 1N400x</text><text x="456" y="922" text-anchor="middle" class="tiny">K to coil+, A to coil−</text><path d="M526 912 H566 V926" class="k"/>
<rect x="617" y="901" width="108" height="61" rx="7" class="comp"/><text x="671" y="925" text-anchor="middle" class="lab">Q1</text><text x="671" y="945" text-anchor="middle" class="sm">N-MOSFET</text><path d="M671 962 V983 H778" class="k"/><text x="787" y="988" class="lab">GND</text>
<path d="M725 930 H765" class="g"/><rect x="765" y="914" width="98" height="32" rx="5" class="comp"/><text x="814" y="934" text-anchor="middle" class="sm">Rg 100 Ω</text><path d="M863 930 H908" class="g"/><text x="865" y="914" class="tiny" fill="#12836b">UV_RELAY_CMD</text>
<path d="M746 930 V962" class="k"/><rect x="725" y="962" width="42" height="25" rx="4" class="comp"/><text x="746" y="979" text-anchor="middle" class="tiny">10 k</text><path d="M746 987 V993 H778 V983" class="k"/>
<text x="922" y="849" class="lab">Action</text><text x="922" y="873" class="tx">SW2 opens → K1 coil supply is interrupted.</text><text x="922" y="896" class="tx">MCU reset → Rpd biases Q1 OFF.</text><text x="922" y="925" class="sm">Q1: logic-level N-MOSFET with RDS(on)</text><text x="922" y="943" class="sm">specified at VGS = 4.5–5 V. Do not</text><text x="922" y="961" class="sm">use IRF540N blindly without a gate driver.</text><text x="922" y="986" class="sm">Extra protection layer, not certified safety.</text>
<rect x="1120" y="804" width="620" height="205" rx="9" class="warn"/><text x="1142" y="832" class="lab">K1 isolated contacts → AC load subsystem</text><rect x="1145" y="850" width="180" height="65" rx="7" class="comp"/><text x="1235" y="874" text-anchor="middle" class="lab">K1 contacts</text><text x="1235" y="895" text-anchor="middle" class="sm">COM / NO · rating TBD</text><path d="M1325 883 H1360" class="dash"/><rect x="1360" y="850" width="350" height="65" rx="7" class="comp"/><text x="1535" y="874" text-anchor="middle" class="lab">Rated ballast / driver enclosure</text><text x="1535" y="895" text-anchor="middle" class="sm">2 × specified UV-C lamps; both switch together</text><text x="1142" y="943" class="hot">AC mains and ballast wiring intentionally omitted.</text><text x="1142" y="965" class="tx">Use matching ballast(s), protected enclosure, strain relief</text><text x="1142" y="986" class="tx">and independent mains-rated door interlock review.</text>

<rect x="35" y="1057" width="1730" height="155" rx="12" class="panel"/><text x="60" y="1090" class="sec">D. CORRECTIONS / SCOPE</text>
<text x="65" y="1120" class="tx">• R1 added in series with power LED. LM7805 removed for a regulated 5 V adapter.</text><text x="65" y="1144" class="tx">• IRF540N replaced by the requirement for a logic-level MOSFET; verify the selected part datasheet.</text><text x="65" y="1168" class="tx">• SW1 reads door state; SW2 is a separate NC coil inhibit. Relay contacts can still fail welded.</text>
<text x="930" y="1120" class="tx">• Baseline includes two UV-C lamps and matching driver/ballast. One channel switches both if ratings permit.</text><text x="930" y="1144" class="tx">• Heater/fan/solenoid removed from baseline; temperature/RH remains optional.</text><text x="930" y="1168" class="tx">• Pin numbers TBD until MCU chosen. Not a fabrication-ready or certified sterilizer design.</text>
<text x="900" y="1230" text-anchor="middle" class="sm">JST-XH pitch = 2.5 mm. Verify connector, LCD-backpack pin order and every component datasheet before wiring.</text>
</svg>