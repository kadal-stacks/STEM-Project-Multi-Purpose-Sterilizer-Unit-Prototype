<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210" role="img" aria-labelledby="title desc">
<title id="title">Corrected schematic with STC8G1K08A-36I DFN8, revision 1.6</title>
<desc id="desc">Engineering-style monochrome schematic for a UV-C sterilizer controller using the STC8G1K08A-36I DFN8. Physical pin mapping: pin 1 P5.4 reserved for ISP/reset, pin 2 VCC, pin 3 P5.5 relay command, pin 4 GND, pin 5 P3.0 door monitor, pin 6 P3.1 start/stop, pin 7 P3.2 I2C SCL, pin 8 P3.3 I2C SDA, and symbol EPAD pin 9 held for package guidance. The discrete relay-coil driver is low voltage; AC/ballast is represented only as a functional safety boundary.</desc>
<defs>
<style>
.bg{fill:#fff;stroke:#111;stroke-width:2}.box{fill:#fff;stroke:#111;stroke-width:1.6}.wire{fill:none;stroke:#111;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#111;stroke-width:1.1}.dash{fill:none;stroke:#111;stroke-width:1.35;stroke-dasharray:6 4}.title{font:700 27px Arial,Helvetica,sans-serif;fill:#111}.sec{font:700 17px Arial,Helvetica,sans-serif;fill:#111}.lab{font:700 13px Arial,Helvetica,sans-serif;fill:#111}.txt{font:12px Arial,Helvetica,sans-serif;fill:#111}.sm{font:10.5px Arial,Helvetica,sans-serif;fill:#111}.tiny{font:9.5px Arial,Helvetica,sans-serif;fill:#111}.net{font:700 11px Arial,Helvetica,sans-serif;fill:#111}.dot{fill:#111}.tag{fill:#fff;stroke:#111;stroke-width:1.1}.part{fill:#fff;stroke:#111;stroke-width:1.4}
</style>
