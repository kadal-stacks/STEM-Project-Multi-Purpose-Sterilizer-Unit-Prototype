<text x="48" y="53" class="title">MULTI-PURPOSE STERILIZER UNIT PROTOTYPE</text>
<text x="50" y="78" class="txt">CORRECTED SCHEMATIC · STC8G1K08A-36I DFN8 · REV 1.6 · 27 OCT 2026</text>
<text x="1745" y="52" text-anchor="end" class="lab">ENGINEERING REVIEW DRAFT</text>
<text x="1745" y="75" text-anchor="end" class="sm">Physical MCU pins updated from package pinout</text>
<path d="M35 98H1765" class="wire"/>

<!-- A: supply -->
<rect x="40" y="115" width="430" height="218" class="box"/>
<text x="58" y="144" class="sec">A. 5 V CONTROL SUPPLY</text>
<text x="58" y="163" class="sm">Regulated, isolated DC adapter</text>
<rect x="62" y="189" width="116" height="85" class="box"/>
<text x="120" y="208" text-anchor="middle" class="lab">J1 · JST-XH-2</text>
<text x="74" y="232" class="sm">1 +5V_IN</text><text x="74" y="253" class="sm">2 GND_CTL</text>
<path d="M178 230H204" class="wire"/><rect x="204" y="220" width="52" height="20" class="part"/><text x="230" y="234" text-anchor="middle" class="sm">F1*</text><path d="M256 230H446" class="wire"/><text x="268" y="218" class="net">+5V_CTL</text>
<path d="M178 253H190V296H446" class="wire"/><text x="270" y="314" class="net">GND_CTL</text>
<!-- C1 100n -->
<path d="M310 230V258M299 258H321M299 266H321M310 266V296" class="wire"/><circle cx="310" cy="230" r="2.6" class="dot"/><circle cx="310" cy="296" r="2.6" class="dot"/><text x="328" y="255" class="sm">C1 100 nF</text>
<!-- C2 10u -->
<path d="M380 230V258M369 258H391M369 266H391M380 266V296" class="wire"/><circle cx="380" cy="230" r="2.6" class="dot"/><circle cx="380" cy="296" r="2.6" class="dot"/><text x="398" y="255" class="sm">C2 10 µF</text>
<text x="58" y="316" class="tiny">F1 optional; select after current budget. LM7805 removed.</text>

<!-- B: MCU -->
<rect x="490" y="115" width="650" height="435" class="box"/>
<text x="510" y="144" class="sec">B. U1 · STC8G1K08A-36I-DFN8</text>
<text x="510" y="165" class="sm">Six GPIO pins · one-chip baseline · package pins shown explicitly</text>
<!-- MCU body -->
<rect x="690" y="225" width="270" height="225" class="box"/>
<text x="825" y="253" text-anchor="middle" class="lab">U1</text>
<text x="825" y="274" text-anchor="middle" class="lab">STC8G1K08A-36I</text>
<text x="825" y="293" text-anchor="middle" class="txt">DFN8 3 × 3 mm</text>
<path d="M708 306H942" class="thin"/>
<text x="825" y="327" text-anchor="middle" class="sm">8051 / 1T · 8 KB Flash</text>
<text x="825" y="345" text-anchor="middle" class="sm">VCC 1.9–5.5 V</text>
<text x="825" y="377" text-anchor="middle" class="sm">NET LABELS, NOT ADDITIONAL GPIO</text>
<text x="825" y="394" text-anchor="middle" class="sm">P3.0/P3.1 also support UART ISP</text>
<text x="825" y="425" text-anchor="middle" class="tiny">EPAD pin 9 electrical tie: verify package note</text>
<!-- left pins 5,6,7; pin functions labelled directly -->
<path d="M690 278H654" class="wire"/><circle cx="690" cy="278" r="2.7" class="dot"/><text x="684" y="270" text-anchor="end" class="sm">5</text><text x="646" y="273" text-anchor="end" class="lab">P3.0</text><text x="646" y="286" text-anchor="end" class="tiny">DOOR_SENSE</text>
<path d="M690 326H654" class="wire"/><circle cx="690" cy="326" r="2.7" class="dot"/><text x="684" y="318" text-anchor="end" class="sm">6</text><text x="646" y="321" text-anchor="end" class="lab">P3.1</text><text x="646" y="334" text-anchor="end" class="tiny">START_STOP</text>
<path d="M690 374H654" class="wire"/><circle cx="690" cy="374" r="2.7" class="dot"/><text x="684" y="366" text-anchor="end" class="sm">7</text><text x="646" y="369" text-anchor="end" class="lab">P3.2</text><text x="646" y="382" text-anchor="end" class="tiny">I2C_SCL</text>
<!-- right pins 8,1,3; pin functions labelled directly -->
<path d="M960 278H997" class="wire"/><circle cx="960" cy="278" r="2.7" class="dot"/><text x="968" y="270" class="sm">8</text><text x="1005" y="273" class="lab">P3.3</text><text x="1005" y="286" class="tiny">I2C_SDA</text>
<path d="M960 326H997" class="wire"/><circle cx="960" cy="326" r="2.7" class="dot"/><text x="968" y="318" class="sm">1</text><text x="1005" y="321" class="lab">P5.4</text><text x="1005" y="334" class="tiny">RESERVED / ISP-RST</text>
<path d="M960 374H997" class="wire"/><circle cx="960" cy="374" r="2.7" class="dot"/><text x="968" y="366" class="sm">3</text><text x="1005" y="369" class="lab">P5.5</text><text x="1005" y="382" class="tiny">RELAY_CMD</text>
<!-- top pin2 VCC -->
<path d="M790 225V197" class="wire"/><circle cx="790" cy="225" r="2.7" class="dot"/><text x="778" y="216" text-anchor="end" class="sm">2</text><text x="790" y="187" text-anchor="middle" class="lab">VCC → +5V_CTL</text>
<!-- bottom pin4 GND and EPAD9 -->
<path d="M760 450V470" class="wire"/><circle cx="760" cy="450" r="2.7" class="dot"/><text x="748" y="465" text-anchor="end" class="sm">4</text><path d="M747 473H773M751 480H769M756 487H764" class="wire"/><text x="760" y="503" text-anchor="middle" class="tiny">GND_CTL</text>
<path d="M875 450V470" class="wire"/><circle cx="875" cy="450" r="2.7" class="dot"/><text x="886" y="465" class="sm">9</text><rect x="825" y="470" width="100" height="22" class="tag"/><text x="875" y="485" text-anchor="middle" class="tiny">EPAD · not netted</text>
<text x="510" y="526" class="sm">P5.4 is reserved because it can be configured as low-active reset during ISP.</text>
<text x="510" y="542" class="tiny">EPAD 9 substrate is not internally grounded; GND tie or open per STC package manual.</text>

<!-- C: LCD -->
<rect x="1160" y="115" width="600" height="265" class="box"/>
<text x="1180" y="144" class="sec">C. LCD 16×2 WITH I²C BACKPACK</text>
<rect x="1185" y="182" width="145" height="151" class="box"/>
<text x="1257" y="204" text-anchor="middle" class="lab">J2 · JST-XH-4</text><path d="M1198 216H1317M1198 243H1317M1198 270H1317M1198 297H1317" class="thin"/>
<text x="1198" y="234" class="sm">1 VCC</text><text x="1198" y="261" class="sm">2 GND</text><text x="1198" y="288" class="sm">3 SDA</text><text x="1198" y="315" class="sm">4 SCL</text>
<path d="M1330 224H1372V224H1400" class="wire"/><text x="1336" y="216" class="tiny">+5V_CTL</text><path d="M1330 251H1382V251H1400" class="wire"/><text x="1336" y="243" class="tiny">GND_CTL</text>
<path d="M1330 278H1390V278H1400" class="wire"/><text x="1336" y="270" class="tiny">I2C_SDA</text><path d="M1330 305H1398V305H1400" class="wire"/><text x="1336" y="297" class="tiny">I2C_SCL</text>
<rect x="1400" y="185" width="330" height="123" class="box"/><rect x="1415" y="199" width="300" height="75" class="box"/><text x="1565" y="292" text-anchor="middle" class="lab">LCD 16×2 module</text><text x="1565" y="306" text-anchor="middle" class="sm">with I²C backpack</text>
<text x="1180" y="350" class="sm">Pin order is our harness plan; verify actual backpack silkscreen.</text><text x="1180" y="367" class="tiny">Use backpack pull-ups if fitted; otherwise add suitable I²C pull-ups to +5 V.</text>

<!-- D: user inputs -->
<rect x="40" y="355" width="430" height="565" class="box"/>
<text x="58" y="384" class="sec">D. USER INPUTS</text>
<text x="58" y="410" class="lab">SW1 · Door-state monitor (NC)</text>
<rect x="60" y="425" width="155" height="64" class="box"/><text x="137" y="446" text-anchor="middle" class="lab">J3 · JST-XH-2</text><text x="72" y="466" class="sm">1 DOOR_SENSE</text><text x="72" y="482" class="sm">2 GND_CTL</text>
<rect x="240" y="425" width="208" height="64" class="dash"/><text x="344" y="444" text-anchor="middle" class="sm">External NC contact SW1</text><circle cx="270" cy="463" r="2.6" class="dot"/><circle cx="319" cy="463" r="2.6" class="dot"/><path d="M270 463H319" class="wire"/><rect x="250" y="470" width="76" height="15" class="tag"/><text x="288" y="481" text-anchor="middle" class="tiny">DOOR_SENSE</text><rect x="329" y="470" width="77" height="15" class="tag"/><text x="367" y="481" text-anchor="middle" class="tiny">GND_CTL</text>
<text x="58" y="514" class="sm">R2 10 kΩ pull-up: +5V_CTL → DOOR_SENSE.</text><text x="58" y="532" class="sm">Closed = LOW; open/broken cable = HIGH fault.</text>
<path d="M83 553V565" class="wire"/><rect x="72" y="565" width="22" height="39" class="box"/><path d="M76 569L90 577L76 585L90 593L76 601" class="thin"/><path d="M83 604V625H197" class="wire"/><path d="M83 553H130" class="wire"/><text x="135" y="557" class="tiny">+5V_CTL</text><text x="104" y="581" class="tiny">R2</text><rect x="197" y="615" width="112" height="20" class="tag"/><text x="253" y="629" text-anchor="middle" class="tiny">DOOR_SENSE</text>
<text x="58" y="672" class="lab">S1 · Start/Stop (momentary NO)</text>
<rect x="60" y="689" width="155" height="64" class="box"/><text x="137" y="710" text-anchor="middle" class="lab">J4 · JST-XH-2</text><text x="72" y="730" class="sm">1 START_STOP</text><text x="72" y="746" class="sm">2 GND_CTL</text>
<rect x="240" y="689" width="208" height="64" class="dash"/><text x="344" y="708" text-anchor="middle" class="sm">External momentary NO button</text><circle cx="270" cy="728" r="2.6" class="dot"/><circle cx="319" cy="728" r="2.6" class="dot"/><path d="M270 728L309 713" class="wire"/><rect x="250" y="734" width="76" height="15" class="tag"/><text x="288" y="745" text-anchor="middle" class="tiny">START_STOP</text><rect x="329" y="734" width="77" height="15" class="tag"/><text x="367" y="745" text-anchor="middle" class="tiny">GND_CTL</text>
<path d="M83 779V792" class="wire"/><rect x="72" y="792" width="22" height="39" class="box"/><path d="M76 796L90 804L76 812L90 820L76 828" class="thin"/><path d="M83 831V851H197" class="wire"/><path d="M83 779H130" class="wire"/><text x="135" y="783" class="tiny">+5V_CTL</text><text x="104" y="808" class="tiny">R3</text><text x="58" y="873" class="sm">R3 10 kΩ pull-up; press = LOW. Not an emergency stop.</text>
<text x="58" y="895" class="sm">P3.0/P3.1 are also UART ISP pins. Disconnect J3/J4</text><text x="58" y="911" class="sm">harnesses if they interfere with programming.</text>

<!-- E: relay driver -->
<rect x="490" y="570" width="650" height="350" class="box"/>
<text x="510" y="599" class="sec">E. RELAY COIL DRIVER · LOW-VOLTAGE ONLY</text>
<text x="510" y="619" class="sm">Bare 5 V DC relay + logic-level N-MOSFET Q1</text>
<!-- coil supply line -->
<text x="515" y="662" class="net">+5V_CTL</text><path d="M578 657H610" class="wire"/><circle cx="610" cy="657" r="2.6" class="dot"/><circle cx="660" cy="657" r="2.6" class="dot"/><path d="M610 657H660" class="wire"/><text x="635" y="642" text-anchor="middle" class="sm">SW2 NC</text><text x="635" y="674" text-anchor="middle" class="tiny">coil inhibit</text><path d="M660 657H690" class="wire"/>
<rect x="690" y="638" width="126" height="38" rx="15" class="box"/><text x="753" y="662" text-anchor="middle" class="lab">K1 · 5 V coil</text>
<!-- Coil negative node to MOSFET drain -->
<path d="M816 657H858V724H1005V730" class="wire"/><text x="826" y="645" class="tiny">COIL− / DRAIN</text>
<!-- Flyback diode parallel across relay coil: cathode toward +5 V -->
<path d="M690 657V705H711" class="wire"/><path d="M711 693V717" class="wire"/><path d="M731 693L731 717L711 705Z" fill="#fff" stroke="#111" stroke-width="1.5"/><path d="M731 705H858V657" class="wire"/><text x="740" y="691" class="sm">D1 1N4007</text><text x="740" y="728" class="tiny">K to +5 V; A to drain</text>
<!-- Simplified N-MOSFET symbol with named terminals -->
<path d="M1005 730V737" class="wire"/><path d="M1005 770V807" class="wire"/><path d="M988 737V770" class="wire"/><path d="M960 753H988" class="wire"/><circle cx="960" cy="753" r="2.6" class="dot"/>
<text x="947" y="746" text-anchor="end" class="tiny">G</text><text x="1016" y="733" class="tiny">D</text><text x="1016" y="802" class="tiny">S</text>
<text x="1035" y="749" class="lab">Q1</text><text x="1035" y="767" class="sm">FQP30N06L*</text><text x="1035" y="785" class="tiny">logic-level</text>
<path d="M1005 807V829H1080" class="wire"/><path d="M1068 829H1092M1072 836H1088M1077 843H1083" class="wire"/><text x="1082" y="821" class="tiny">GND_CTL</text>
<!-- Gate signal uses the same net label as U1 pin 3 -->
<rect x="700" y="740" width="84" height="20" class="tag"/><text x="742" y="754" text-anchor="middle" class="tiny">RELAY_CMD</text><path d="M784 750H800" class="wire"/>
<rect x="800" y="738" width="70" height="24" class="box"/><text x="835" y="754" text-anchor="middle" class="sm">Rg 100 Ω</text><path d="M870 750H960" class="wire"/>
<!-- Gate-to-source pull-down -->
<path d="M930 750V775" class="wire"/><rect x="918" y="775" width="24" height="38" class="box"/><path d="M922 779L938 786L922 793L938 800L922 807" class="thin"/><text x="910" y="770" text-anchor="end" class="tiny">R4 100 kΩ</text><path d="M930 813V824H1005V807" class="wire"/>
<text x="510" y="878" class="sm">SW2 NC interrupts coil power if the enclosure door is opened.</text><text x="510" y="898" class="sm">R4 gate-to-source keeps Q1 OFF on reset. Verify Q1 pinout/rating.</text>

<!-- F: AC/UV safety block -->
<rect x="1160" y="395" width="600" height="525" class="box"/>
<text x="1180" y="424" class="sec">F. UV-C LOAD · FUNCTIONAL BLOCK ONLY</text>
<text x="1180" y="446" class="sm">AC wiring/ballast details intentionally omitted</text>
<rect x="1200" y="470" width="520" height="55" class="box"/><text x="1460" y="493" text-anchor="middle" class="lab">AC input + suitable protection</text><text x="1460" y="512" text-anchor="middle" class="sm">final ratings TBD</text>
<path d="M1460 525V548" class="dash"/>
<rect x="1200" y="548" width="520" height="66" class="box"/><text x="1460" y="572" text-anchor="middle" class="lab">SW3 · independent mains-rated door interlock</text><text x="1460" y="594" text-anchor="middle" class="sm">Door opens → lamp power interrupted independently</text>
<path d="M1460 614V638" class="dash"/>
<rect x="1200" y="638" width="520" height="55" class="box"/><text x="1460" y="660" text-anchor="middle" class="lab">K1 isolated contacts</text><text x="1460" y="680" text-anchor="middle" class="sm">rating must suit ballast inrush and lamp load</text>
<path d="M1460 693V717" class="dash"/>
<rect x="1200" y="717" width="520" height="60" class="box"/><text x="1460" y="741" text-anchor="middle" class="lab">Matched ballast / driver(s)</text><text x="1460" y="762" text-anchor="middle" class="sm">selected for actual two-lamp model</text>
<path d="M1460 777V801" class="dash"/>
<rect x="1200" y="801" width="520" height="57" class="box"/><text x="1460" y="824" text-anchor="middle" class="lab">2 × UV-C lamps</text><text x="1460" y="844" text-anchor="middle" class="sm">one relay channel switches both if ratings permit</text>
<text x="1180" y="885" class="sm">SW3 remains necessary if K1 contacts weld closed.</text><text x="1180" y="903" class="tiny">Use opaque enclosure; no open-lamp testing.</text>

<!-- G: notes and title -->
<rect x="40" y="945" width="1245" height="230" class="box"/>
<text x="58" y="974" class="sec">G. PIN MAP AND REVISION NOTES</text>
<text x="60" y="1000" class="txt">Pin 1 P5.4 = reserved for ISP/reset function; Pin 2 VCC = +5V_CTL; Pin 3 P5.5 = RELAY_CMD.</text>
<text x="60" y="1023" class="txt">Pin 4 GND = GND_CTL; Pin 5 P3.0 = DOOR_SENSE; Pin 6 P3.1 = START_STOP.</text>
<text x="60" y="1046" class="txt">Pin 7 P3.2 = I2C_SCL; Pin 8 P3.3 = I2C_SDA; symbol pin 9 EPAD = verify package guidance, no assumed net.</text>
<text x="60" y="1069" class="sm">P3.0/P3.1 are also UART ISP pins. Disconnect input harnesses if programming communication is affected.</text>
<text x="60" y="1091" class="sm">At power-up, do not allow P3.0, P3.1 and P3.2 to all be LOW simultaneously; keep pull-ups/boot conditions in mind.</text>
<text x="60" y="1113" class="sm">P5.4 can be configured as an active-low reset for ISP, so it is not used for the relay or baseline sensor.</text>
<text x="60" y="1135" class="sm">The circuit is a review draft. Confirm datasheets, MOSFET/relay details and independent safety before assembly.</text>
<text x="60" y="1157" class="tiny">Source: STC8G1K08A official feature datasheet; see schematic-optimized-v1.md for references and detailed notes.</text>
