<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
<title id="title">Multi-Purpose Sterilizer Unit Prototype, optimized schematic revision 1.3</title>
<desc id="desc">Black and white circuit-style schematic. A regulated 5V input feeds a controller MCU, a 16 by 2 I2C LCD, a door-monitor switch input, a start-stop button, and a discrete logic-level MOSFET driver for a 5V relay coil. A separate NC switch inhibits relay-coil power while the door is open. The AC side is shown only as a functional block: protection, independent mains-rated interlock, relay contacts, matching ballast and two UV-C lamps. No mains wiring detail is provided.</desc>
<defs>
<style>
.bg{fill:#fff;stroke:#111;stroke-width:2}.line{fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#111;stroke-width:1.2}.dash{fill:none;stroke:#111;stroke-width:1.4;stroke-dasharray:7 5}.blk{fill:#fff;stroke:#111;stroke-width:1.8}.txt{font:14px Arial,Helvetica,sans-serif;fill:#111}.sm{font:12px Arial,Helvetica,sans-serif;fill:#111}.tiny{font:10.5px Arial,Helvetica,sans-serif;fill:#111}.lab{font:700 15px Arial,Helvetica,sans-serif;fill:#111}.sec{font:700 18px Arial,Helvetica,sans-serif;fill:#111}.title{font:700 28px Arial,Helvetica,sans-serif;fill:#111}.net{font:700 12px Arial,Helvetica,sans-serif;fill:#111}.dot{fill:#111}.tag{fill:#fff;stroke:#111;stroke-width:1.3}
</style>
<pattern id="matrix" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="2" fill="#fff" stroke="#777" stroke-width=".7"/></pattern>
</defs>
<rect x="18" y="18" width="1764" height="1204" class="bg"/>
<!-- Header -->
<text x="48" y="56" class="title">MULTI-PURPOSE STERILIZER UNIT PROTOTYPE</text>
<text x="50" y="82" class="txt">OPTIMIZED SCHEMATIC · REV 1.3 · 27 OCT 2026</text>
<text x="1745" y="55" text-anchor="end" class="lab">ENGINEERING REVIEW DRAFT</text>
<text x="1745" y="78" text-anchor="end" class="sm">Logical pin names shown; exact MCU pins TBD</text>
<path d="M35 101H1765" class="line"/>

<!-- A Power -->
<rect x="40" y="120" width="660" height="280" class="blk"/>
<text x="60" y="150" class="sec">A. CONTROL POWER (5 V DC)</text>
<text x="60" y="172" class="sm">Use an isolated, regulated 5 V adapter</text>
<!-- input connector -->
<rect x="65" y="198" width="115" height="83" class="blk"/>
<text x="122" y="219" text-anchor="middle" class="lab">J1 · XH-2</text>
<circle cx="82" cy="240" r="5" class="blk"/><circle cx="82" cy="262" r="5" class="blk"/>
<text x="96" y="244" class="sm">1 +5V_CTL</text><text x="96" y="266" class="sm">2 GND_CTL</text>
<text x="122" y="299" text-anchor="middle" class="tiny">5 V input</text>
<!-- fuse and rails -->
<path d="M180 240H214" class="line"/><rect x="214" y="229" width="58" height="22" class="blk"/><text x="243" y="244" text-anchor="middle" class="sm">F1*</text><path d="M272 240H663" class="line"/><text x="293" y="228" class="net">+5V_CTL</text>
<path d="M180 262H197V343H663" class="line"/><text x="295" y="362" class="net">GND_CTL</text>
<!-- C1 -->
<path d="M343 240V278M330 278H356M330 287H356M343 287V343" class="line"/><circle cx="343" cy="240" r="3" class="dot"/><circle cx="343" cy="343" r="3" class="dot"/><text x="365" y="278" class="sm">C1 100 nF</text>
<!-- C2 -->
<path d="M465 240V278M452 278H478M452 287H478M465 287V343" class="line"/><circle cx="465" cy="240" r="3" class="dot"/><circle cx="465" cy="343" r="3" class="dot"/><text x="487" y="278" class="sm">C2 47–100 µF</text>
<!-- LED branch with series resistor -->
<path d="M574 240V251" class="line"/><rect x="563" y="251" width="22" height="38" class="blk"/><path d="M567 255L581 261L567 267L581 273L567 279L581 285" class="thin"/><text x="592" y="265" class="sm">R1</text><text x="592" y="279" class="sm">1 kΩ</text><path d="M574 289V297" class="line"/><circle cx="574" cy="307" r="8" class="blk"/><path d="M568 301L580 313M580 301L568 313" class="thin"/><path d="M574 315V343" class="line"/><circle cx="574" cy="240" r="3" class="dot"/><circle cx="574" cy="343" r="3" class="dot"/><text x="592" y="312" class="sm">LED1</text>
<text x="60" y="382" class="sm">LM7805 omitted: no regulator after an already-regulated 5 V input.</text>
<text x="60" y="394" class="tiny">F1 rating and supply current are TBD; choose after load-current calculation.</text>

<!-- B MCU -->
<rect x="720" y="120" width="475" height="330" class="blk"/>
<text x="740" y="150" class="sec">B. MICROCONTROLLER U1</text>
<text x="740" y="172" class="sm">Select one MCU; no pin numbers until package is final</text>
<rect x="815" y="198" width="285" height="208" class="blk"/>
<text x="957" y="224" text-anchor="middle" class="lab">U1 · MCU</text>
<text x="957" y="247" text-anchor="middle" class="txt">CH32V003F4P6 (TSSOP-20)</text>
<text x="957" y="267" text-anchor="middle" class="sm">OR STC8H1K08, exact variant TBD</text>
<path d="M835 280H1080" class="thin"/>
<text x="837" y="303" class="txt">VDD / +5V_CTL</text>
<text x="837" y="326" class="txt">GND / GND_CTL</text>
<text x="837" y="349" class="txt">DOOR_SENSE</text>
<text x="837" y="372" class="txt">START_STOP</text>
<text x="837" y="395" class="txt">I2C_SDA / I2C_SCL / UV_RELAY_CMD</text>
<text x="740" y="430" class="sm">Logical net labels only; use the selected device datasheet</text><text x="740" y="443" class="sm">to assign real package pins in the final CAD schematic.</text>
<!-- Power net labels on MCU -->
<path d="M815 303H785" class="line"/><rect x="735" y="292" width="50" height="20" class="tag"/><text x="760" y="306" text-anchor="middle" class="tiny">+5V</text>
<path d="M815 326H785" class="line"/><rect x="735" y="315" width="50" height="20" class="tag"/><text x="760" y="329" text-anchor="middle" class="tiny">GND</text>
<!-- I/O net labels to other sections -->
<path d="M815 349H770" class="line"/><rect x="724" y="339" width="92" height="20" class="tag"/><text x="770" y="353" text-anchor="middle" class="tiny">DOOR_SENSE</text>
<path d="M815 372H770" class="line"/><rect x="724" y="362" width="92" height="20" class="tag"/><text x="770" y="376" text-anchor="middle" class="tiny">START_STOP</text>
<path d="M1100 395H1165" class="line"/><text x="1107" y="386" class="tiny">I2C / RELAY nets by label</text>

<!-- C LCD -->
<rect x="1215" y="120" width="545" height="330" class="blk"/>
<text x="1235" y="150" class="sec">C. LCD 16×2 WITH I²C BACKPACK</text>
<rect x="1242" y="192" width="138" height="146" class="blk"/>
<text x="1311" y="214" text-anchor="middle" class="lab">J2 · JST-XH-4</text>
<path d="M1255 224H1367M1255 251H1367M1255 278H1367M1255 305H1367" class="thin"/>
<text x="1255" y="241" class="sm">1 VCC</text><text x="1255" y="268" class="sm">2 GND</text><text x="1255" y="295" class="sm">3 SDA</text><text x="1255" y="322" class="sm">4 SCL</text>
<rect x="1435" y="201" width="295" height="144" class="blk"/><rect x="1450" y="217" width="265" height="86" class="blk"/>
<text x="1582" y="322" text-anchor="middle" class="lab">LCD module</text><text x="1582" y="339" text-anchor="middle" class="sm">16×2 + I²C backpack</text>
<path d="M1380 232H1407V232H1435" class="line"/><text x="1390" y="223" class="tiny">+5V_CTL</text>
<path d="M1380 259H1417V258H1435" class="line"/><text x="1390" y="251" class="tiny">GND_CTL</text>
<path d="M1380 286H1415V282H1435" class="line"/><text x="1390" y="278" class="tiny">I2C_SDA</text>
<path d="M1380 313H1424V307H1435" class="line"/><text x="1390" y="305" class="tiny">I2C_SCL</text>
<text x="1235" y="378" class="sm">Pinout for our harness: VCC, GND, SDA, SCL.</text><text x="1235" y="396" class="sm">Verify actual backpack silkscreen before wiring.</text><text x="1235" y="414" class="sm">5 V logic assumed; a 3.3 V-only board may need I²C level shifting.</text>

<!-- D inputs -->
<rect x="40" y="465" width="660" height="515" class="blk"/>
<text x="60" y="495" class="sec">D. DOOR MONITOR AND START / STOP INPUTS</text>
<!-- Door monitor -->
<text x="60" y="526" class="lab">SW1 · Door monitor NC, external through J3</text>
<rect x="65" y="544" width="120" height="80" class="blk"/><text x="125" y="565" text-anchor="middle" class="lab">J3 · XH-2</text><text x="78" y="587" class="sm">1 DOOR_SENSE</text><text x="78" y="607" class="sm">2 GND_CTL</text>
<path d="M185 582H215" class="line"/><circle cx="215" cy="582" r="3" class="dot"/><path d="M215 582H270" class="line"/><circle cx="270" cy="582" r="3" class="dot"/><path d="M270 582L306 564" class="line"/><path d="M306 582H343V612H365" class="line"/>
<text x="270" y="548" text-anchor="middle" class="sm">SW1 NC</text><text x="270" y="602" text-anchor="middle" class="tiny">door closed = contact closed</text>
<path d="M185 606H343V635H365" class="line"/><text x="370" y="617" class="tiny">to GND_CTL</text>
<!-- Pull-up -->
<rect x="410" y="543" width="45" height="58" class="blk"/><path d="M416 548L449 557L416 566L449 575L416 584L449 593" class="thin"/><text x="465" y="566" class="sm">R2 10 kΩ</text><text x="465" y="582" class="sm">pull-up</text>
<path d="M432 543V525H490" class="line"/><text x="495" y="529" class="net">+5V_CTL</text>
<path d="M432 601V646H650" class="line"/><text x="520" y="639" class="net">DOOR_SENSE → U1</text>
<text x="60" y="671" class="sm">NC closed pulls DOOR_SENSE LOW; door open or broken wire reads HIGH/fault.</text>
<!-- Start stop -->
<text x="60" y="714" class="lab">S1 · Start/Stop momentary NO, external through J4</text>
<rect x="65" y="734" width="120" height="80" class="blk"/><text x="125" y="755" text-anchor="middle" class="lab">J4 · XH-2</text><text x="78" y="777" class="sm">1 START_STOP</text><text x="78" y="797" class="sm">2 GND_CTL</text>
<path d="M185 772H215" class="line"/><circle cx="215" cy="772" r="3" class="dot"/><circle cx="270" cy="772" r="3" class="dot"/><path d="M215 772L257 750" class="line"/><path d="M270 772H343V802H365" class="line"/>
<text x="244" y="738" text-anchor="middle" class="sm">S1 NO</text><path d="M185 796H343V824H365" class="line"/><text x="370" y="807" class="tiny">to GND_CTL</text>
<rect x="410" y="734" width="45" height="58" class="blk"/><path d="M416 739L449 748L416 757L449 766L416 775L449 784" class="thin"/><text x="465" y="757" class="sm">R3 10 kΩ</text><text x="465" y="773" class="sm">pull-up</text>
<path d="M432 734V716H490" class="line"/><text x="495" y="720" class="net">+5V_CTL</text><path d="M432 792V841H650" class="line"/><text x="520" y="834" class="net">START_STOP → U1</text>
<text x="60" y="870" class="sm">S1 is a user-interface feature; add the pushbutton and harness to the BOM.</text>
<text x="60" y="891" class="sm">Do not use this user button as an emergency stop or UV safety interlock.</text>
<text x="60" y="941" class="tiny">SW1 is only a monitor contact. It does not replace a separate hardware safety cutoff.</text>

<!-- E Relay driver -->
<rect x="720" y="465" width="660" height="515" class="blk"/>
<text x="740" y="495" class="sec">E. RELAY COIL DRIVER (5 V DC)</text>
<text x="740" y="518" class="sm">Use either this discrete driver OR a verified ready-made relay module.</text>
<!-- Coil rail plus SW2 -->
<text x="750" y="566" class="net">+5V_CTL</text><path d="M812 561H850" class="line"/><circle cx="850" cy="561" r="3" class="dot"/><circle cx="895" cy="561" r="3" class="dot"/><path d="M850 561L884 545" class="line"/><path d="M895 561H930" class="line"/>
<text x="872" y="538" text-anchor="middle" class="sm">SW2 NC</text><text x="872" y="580" text-anchor="middle" class="tiny">door inhibits coil</text>
<!-- Relay coil -->
<rect x="930" y="542" width="132" height="38" rx="15" class="blk"/><text x="996" y="565" text-anchor="middle" class="lab">K1 · 5 V coil</text><path d="M1062 561H1100V635H1135" class="line"/><text x="1070" y="548" class="tiny">COIL− / DRAIN</text>
<!-- diode in parallel across coil -->
<path d="M930 561V617H950" class="line"/><path d="M950 617H966" class="line"/><polygon points="966,607 966,627 984,617" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M987 607V627" class="line"/><path d="M987 617H1100V635" class="line"/><text x="1006" y="607" class="sm">D1 1N4007</text><text x="1006" y="631" class="tiny">K to +5V, A to drain</text>
<!-- MOSFET and gate -->
<rect x="1135" y="616" width="190" height="142" class="blk"/><text x="1230" y="640" text-anchor="middle" class="lab">Q1 · N-MOSFET</text>
<!-- schematic N-MOSFET symbol -->
<path d="M1186 663V714" class="line"/><path d="M1204 663V714" class="line"/><path d="M1204 663H1230V635" class="line"/><path d="M1204 714H1230V739" class="line"/><path d="M1166 688H1186" class="line"/><text x="1150" y="682" class="tiny">G</text><text x="1238" y="638" class="tiny">D</text><text x="1238" y="743" class="tiny">S</text>
<path d="M1230 635V635" class="line"/><path d="M1230 739V779H1300" class="line"/><text x="1305" y="784" class="tiny">GND_CTL</text>
<!-- gate resistor path -->
<path d="M1045 688H1070" class="line"/><rect x="1070" y="676" width="42" height="24" class="blk"/><path d="M1075 680L1107 696M1075 696L1107 680" class="thin"/><path d="M1112 688H1166" class="line"/><text x="1090" y="666" text-anchor="middle" class="sm">Rg 100Ω</text><text x="1045" y="711" class="tiny">UV_RELAY_CMD</text>
<!-- Rpd from gate node to source/ground -->
<path d="M1130 688V729" class="line"/><rect x="1118" y="729" width="24" height="48" class="blk"/><text x="1150" y="747" class="tiny">Rpd</text><text x="1150" y="761" class="tiny">100 kΩ</text><path d="M1130 777V790H1300" class="line"/>
<text x="740" y="821" class="sm">Coil current path: +5V_CTL → SW2 NC → K1 coil → Q1 drain/source → GND_CTL.</text>
<text x="740" y="843" class="sm">D1 is across the coil: cathode toward +5 V, anode toward drain/coil−.</text>
<text x="740" y="865" class="sm">Rpd 100 kΩ gate-to-source keeps Q1 OFF when MCU resets.</text>
<text x="740" y="887" class="sm">Choose logic-level Q1 by RDS(on) at VGS = 4.5–5 V and coil current.</text>
<text x="740" y="909" class="sm">If using a relay module with onboard driver/diode, omit Q1/Rg/Rpd/D1.</text>
<text x="740" y="943" class="tiny">Do not use IRF540N by default without verifying gate-drive requirements.</text>

<!-- F Load safety boundary -->
<rect x="1400" y="465" width="360" height="515" class="blk"/>
<text x="1420" y="495" class="sec">F. UV-C LOAD</text><text x="1420" y="518" class="sm">Functional blocks only; no AC wiring</text>
<rect x="1425" y="545" width="310" height="51" class="blk"/><text x="1580" y="566" text-anchor="middle" class="lab">AC supply + protection</text><text x="1580" y="584" text-anchor="middle" class="tiny">specification TBD</text>
<path d="M1580 596V617" class="dash"/>
<rect x="1425" y="617" width="310" height="64" class="blk"/><text x="1580" y="641" text-anchor="middle" class="lab">SW3 · independent mains interlock</text><text x="1580" y="661" text-anchor="middle" class="sm">door open → lamp energy cut</text>
<path d="M1580 681V701" class="dash"/>
<rect x="1425" y="701" width="310" height="55" class="blk"/><text x="1580" y="723" text-anchor="middle" class="lab">K1 isolated contacts</text><text x="1580" y="741" text-anchor="middle" class="sm">rating for ballast/inrush TBD</text>
<path d="M1580 756V776" class="dash"/>
<rect x="1425" y="776" width="310" height="62" class="blk"/><text x="1580" y="799" text-anchor="middle" class="lab">Matched ballast / driver(s)</text><text x="1580" y="820" text-anchor="middle" class="sm">selected for actual lamp model</text>
<path d="M1580 838V858" class="dash"/>
<rect x="1425" y="858" width="310" height="70" class="blk"/><text x="1580" y="883" text-anchor="middle" class="lab">2 × UV-C lamps</text><text x="1580" y="905" text-anchor="middle" class="sm">one channel switches both together</text><text x="1420" y="953" class="sm">SW3 must be independent of MCU and relay</text><text x="1420" y="973" class="sm">coil control; relay contacts may weld closed.</text>

<!-- bottom notes -->
<rect x="40" y="1000" width="1090" height="180" class="blk"/>
<text x="60" y="1030" class="sec">G. CORRECTIONS AND SCOPE</text>
<text x="62" y="1058" class="txt">1. 5 V regulated adapter replaces the 12 V + LM7805 scheme.</text>
<text x="62" y="1082" class="txt">2. LED indicator now has a series resistor; supply capacitors go across 5 V and GND.</text>
<text x="62" y="1106" class="txt">3. MCU physical pins are intentionally not assigned before final MCU/package choice.</text>
<text x="62" y="1130" class="txt">4. SW1 monitors door; SW2 inhibits relay coil; SW3 independently interrupts lamp power.</text>
<text x="62" y="1154" class="txt">5. Heater/fan/solenoid removed from baseline. Start/Stop button is included and must be added to BOM.</text>
<text x="62" y="1172" class="tiny">This remains a draft. It is not a certified design or a guide for wiring mains/ballast.</text>
<!-- Title block -->
<rect x="1150" y="1000" width="610" height="180" class="blk"/>
<path d="M1150 1035H1760M1150 1070H1760M1150 1128H1760M1455 1128V1180" class="thin"/>
<text x="1168" y="1023" class="lab">STEM PROJECT</text><text x="1168" y="1058" class="lab">MULTI-PURPOSE STERILIZER UNIT PROTOTYPE</text><text x="1168" y="1093" class="sm">SCHEMATIC DIAGRAM · REV 1.3</text><text x="1168" y="1113" class="sm">DESIGNED BY: Kadal-Stacks</text><text x="1168" y="1150" class="sm">DATE: 2026-10-27</text><text x="1480" y="1150" class="sm">SHEET: 1 / 1</text><text x="1168" y="1171" class="tiny">DRAFT · NOT FOR MAINS CONSTRUCTION</text>
<text x="900" y="1206" text-anchor="middle" class="sm">JST-XH pitch 2.5 mm. Check pinout, component datasheets, MOSFET package pins, coil current and contact ratings before assembly.</text>
</svg>