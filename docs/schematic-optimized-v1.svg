<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
<title id="title">Multi-Purpose Sterilizer Unit Prototype · corrected schematic rev 1.4</title>
<desc id="desc">Monochrome engineering schematic with regulated 5 V control power, MCU functional nets without unverified physical pin numbers, 16x2 LCD I2C with JST-XH-4, a normally closed door-monitor contact and pull-up, a normally open start stop input, a separate NC relay-coil inhibit, discrete logic-level N-MOSFET coil driver with gate resistor, 100 kiloohm pull-down and flyback diode, and an abstract protected load path with independent mains-rated door interlock and two UV-C lamps. Mains wiring is not detailed.</desc>
<defs><style>
.bg{fill:#fff;stroke:#111;stroke-width:2}.line{fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#111;stroke-width:1.2}.dash{fill:none;stroke:#111;stroke-width:1.4;stroke-dasharray:7 5}.blk{fill:#fff;stroke:#111;stroke-width:1.7}.txt{font:14px Arial,Helvetica,sans-serif;fill:#111}.sm{font:12px Arial,Helvetica,sans-serif;fill:#111}.tiny{font:10.5px Arial,Helvetica,sans-serif;fill:#111}.lab{font:700 15px Arial,Helvetica,sans-serif;fill:#111}.sec{font:700 18px Arial,Helvetica,sans-serif;fill:#111}.title{font:700 28px Arial,Helvetica,sans-serif;fill:#111}.net{font:700 12px Arial,Helvetica,sans-serif;fill:#111}.dot{fill:#111}.tag{fill:#fff;stroke:#111;stroke-width:1.2}
</style></defs>
<rect x="18" y="18" width="1764" height="1244" class="bg"/>
<text x="48" y="55" class="title">MULTI-PURPOSE STERILIZER UNIT PROTOTYPE</text>
<text x="50" y="81" class="txt">CORRECTED SCHEMATIC · REV 1.4 · 27 OCT 2026</text>
<text x="1745" y="53" text-anchor="end" class="lab">ENGINEERING REVIEW DRAFT</text>
<text x="1745" y="76" text-anchor="end" class="sm">Functional MCU nets; exact package pins TBD</text>
<path d="M35 100H1765" class="line"/>

<!-- A: power -->
<rect x="40" y="118" width="650" height="267" class="blk"/>
<text x="60" y="148" class="sec">A. CONTROL POWER (REGULATED 5 V)</text>
<text x="60" y="170" class="sm">5 V isolated adapter; no LM7805 after a regulated 5 V source</text>
<rect x="65" y="194" width="120" height="83" class="blk"/><text x="125" y="216" text-anchor="middle" class="lab">J1 · XH-2</text><text x="82" y="241" class="sm">1 +5V_CTL</text><text x="82" y="264" class="sm">2 GND_CTL</text><circle cx="180" cy="237" r="4" class="dot"/><circle cx="180" cy="260" r="4" class="dot"/>
<path d="M180 237H220" class="line"/><rect x="220" y="226" width="60" height="22" class="blk"/><text x="250" y="241" text-anchor="middle" class="sm">F1*</text><path d="M280 237H665" class="line"/><text x="294" y="225" class="net">+5V_CTL</text><path d="M180 260H202V328H665" class="line"/><text x="294" y="347" class="net">GND_CTL</text>
<!-- bypass capacitors -->
<path d="M352 237V270M340 270H364M340 278H364M352 278V328" class="line"/><circle cx="352" cy="237" r="3" class="dot"/><circle cx="352" cy="328" r="3" class="dot"/><text x="371" y="268" class="sm">C1 100 nF</text>
<path d="M470 237V270M458 270H482M458 278H482M470 278V328" class="line"/><circle cx="470" cy="237" r="3" class="dot"/><circle cx="470" cy="328" r="3" class="dot"/><text x="488" y="268" class="sm">C2 47–100 µF</text>
<!-- LED+R -->
<path d="M574 237V248" class="line"/><rect x="563" y="248" width="22" height="37" class="blk"/><path d="M567 252L581 258L567 264L581 270L567 276L581 282" class="thin"/><text x="591" y="262" class="sm">R1 1 kΩ</text><path d="M574 285V294" class="line"/><circle cx="574" cy="303" r="8" class="blk"/><path d="M568 297L580 309M580 297L568 309" class="thin"/><path d="M574 311V328" class="line"/><circle cx="574" cy="237" r="3" class="dot"/><circle cx="574" cy="328" r="3" class="dot"/><text x="592" y="307" class="sm">LED1</text>
<text x="60" y="369" class="sm">F1 optional; rating TBD from measured current. C1/C2 across +5V_CTL and GND_CTL.</text>

<!-- B: MCU -->
<rect x="710" y="118" width="480" height="267" class="blk"/>
<text x="730" y="148" class="sec">B. MICROCONTROLLER U1</text>
<text x="730" y="170" class="sm">Logical I/O only; no package pin numbers assigned yet</text>
<rect x="815" y="196" width="280" height="174" class="blk"/>
<text x="955" y="224" text-anchor="middle" class="lab">U1 · MCU</text>
<text x="955" y="248" text-anchor="middle" class="txt">CH32V003F4P6 (TSSOP-20)</text>
<text x="955" y="268" text-anchor="middle" class="sm">OR STC8H1K08 (exact variant TBD)</text>
<path d="M835 282H1075" class="thin"/>
<text x="955" y="302" text-anchor="middle" class="sm">Use one MCU only</text>
<text x="955" y="323" text-anchor="middle" class="sm">Assign real pins from datasheet</text>
<!-- U1 power/input nets -->
<path d="M815 282H790" class="line"/><rect x="720" y="272" width="70" height="20" class="tag"/><text x="755" y="286" text-anchor="middle" class="tiny">+5V_CTL</text>
<path d="M815 304H790" class="line"/><rect x="720" y="294" width="70" height="20" class="tag"/><text x="755" y="308" text-anchor="middle" class="tiny">GND_CTL</text>
<path d="M815 326H790" class="line"/><rect x="711" y="316" width="79" height="20" class="tag"/><text x="750" y="330" text-anchor="middle" class="tiny">DOOR_SENSE</text>
<path d="M815 348H790" class="line"/><rect x="711" y="338" width="79" height="20" class="tag"/><text x="750" y="352" text-anchor="middle" class="tiny">START_STOP</text>
<!-- U1 output nets -->
<path d="M1095 304H1107" class="line"/><rect x="1107" y="294" width="81" height="20" class="tag"/><text x="1147" y="308" text-anchor="middle" class="tiny">I2C_SDA</text>
<path d="M1095 326H1107" class="line"/><rect x="1107" y="316" width="81" height="20" class="tag"/><text x="1147" y="330" text-anchor="middle" class="tiny">I2C_SCL</text>
<path d="M1095 348H1107" class="line"/><rect x="1107" y="338" width="81" height="20" class="tag"/><text x="1147" y="352" text-anchor="middle" class="tiny">UV_RELAY_CMD</text>
<text x="730" y="373" class="tiny">Check selected MCU datasheet before mapping to physical pins.</text>

<!-- C: LCD -->
<rect x="1210" y="118" width="550" height="267" class="blk"/>
<text x="1230" y="148" class="sec">C. LCD 16×2 WITH I²C BACKPACK</text>
<rect x="1245" y="190" width="140" height="143" class="blk"/><text x="1315" y="212" text-anchor="middle" class="lab">J2 · JST-XH-4</text><path d="M1258 222H1372M1258 249H1372M1258 276H1372M1258 303H1372" class="thin"/><text x="1258" y="239" class="sm">1 VCC</text><text x="1258" y="266" class="sm">2 GND</text><text x="1258" y="293" class="sm">3 SDA</text><text x="1258" y="320" class="sm">4 SCL</text>
<rect x="1440" y="192" width="285" height="126" class="blk"/><rect x="1453" y="206" width="259" height="74" class="blk"/><text x="1582" y="297" text-anchor="middle" class="lab">LCD module</text><text x="1582" y="313" text-anchor="middle" class="sm">16×2 + I²C backpack</text>
<path d="M1385 226H1410V220H1440" class="line"/><text x="1389" y="214" class="tiny">+5V_CTL</text><path d="M1385 253H1418V245H1440" class="line"/><text x="1389" y="244" class="tiny">GND_CTL</text><path d="M1385 280H1425V270H1440" class="line"/><text x="1389" y="269" class="tiny">I2C_SDA</text><path d="M1385 307H1430V296H1440" class="line"/><text x="1389" y="297" class="tiny">I2C_SCL</text>
<text x="1230" y="355" class="sm">Chosen harness pinout: VCC, GND, SDA, SCL.</text><text x="1230" y="373" class="sm">Verify backpack silkscreen; 5 V logic assumed.</text>

<!-- D: inputs, externally connected by named nets -->
<rect x="40" y="415" width="650" height="520" class="blk"/>
<text x="60" y="445" class="sec">D. DOOR MONITOR AND START / STOP</text>
<!-- Door monitor pullup -->
<text x="60" y="476" class="lab">SW1 · Normally closed door monitor</text>
<text x="60" y="497" class="sm">External contact uses the same named nets as J3.</text>
<rect x="65" y="520" width="145" height="80" class="blk"/>
<text x="137" y="542" text-anchor="middle" class="lab">J3 · JST-XH-2</text>
<text x="78" y="565" class="sm">1 DOOR_SENSE</text>
<text x="78" y="585" class="sm">2 GND_CTL</text>
<!-- SW1 contact: independent net-labelled external contact -->
<rect x="245" y="520" width="230" height="80" class="dash"/>
<text x="360" y="541" text-anchor="middle" class="lab">SW1 · NC contact</text>
<circle cx="292" cy="566" r="3" class="dot"/><circle cx="357" cy="566" r="3" class="dot"/><path d="M292 566H357" class="line"/>
<rect x="249" y="574" width="87" height="18" class="tag"/><text x="292" y="587" text-anchor="middle" class="tiny">DOOR_SENSE</text>
<rect x="341" y="574" width="82" height="18" class="tag"/><text x="382" y="587" text-anchor="middle" class="tiny">GND_CTL</text>
<text x="60" y="621" class="sm">J3 pin 1 = DOOR_SENSE; pin 2 = GND_CTL; harness connects to SW1.</text>
<!-- Pull-up R2 -->
<text x="60" y="655" class="lab">R2 · 10 kΩ pull-up</text>
<text x="60" y="676" class="sm">+5V_CTL ─ R2 ─ DOOR_SENSE (same-name net)</text>
<path d="M110 693V704" class="line"/><rect x="98" y="704" width="24" height="46" class="blk"/><path d="M102 709L118 717L102 725L118 733L102 741" class="thin"/><path d="M110 750V771H250" class="line"/>
<rect x="250" y="761" width="105" height="20" class="tag"/><text x="302" y="775" text-anchor="middle" class="tiny">DOOR_SENSE</text>
<path d="M110 693H175" class="line"/><text x="180" y="697" class="net">+5V_CTL</text>
<text x="60" y="803" class="sm">Door closed = LOW; door open or cable break = HIGH/fault.</text>
<!-- Start stop input -->
<text x="60" y="836" class="lab">S1 · Start/Stop momentary NO</text>
<rect x="65" y="851" width="145" height="65" class="blk"/><text x="137" y="872" text-anchor="middle" class="lab">J4 · JST-XH-2</text><text x="78" y="893" class="sm">1 START_STOP</text><text x="78" y="909" class="sm">2 GND_CTL</text>
<rect x="245" y="851" width="230" height="65" class="dash"/><text x="360" y="871" text-anchor="middle" class="lab">External pushbutton S1 · NO</text><circle cx="292" cy="892" r="3" class="dot"/><circle cx="357" cy="892" r="3" class="dot"/><path d="M292 892L343 876" class="line"/>
<rect x="249" y="896" width="87" height="16" class="tag"/><text x="292" y="908" text-anchor="middle" class="tiny">START_STOP</text><rect x="341" y="896" width="82" height="16" class="tag"/><text x="382" y="908" text-anchor="middle" class="tiny">GND_CTL</text>
<path d="M535 851V862" class="line"/><rect x="523" y="862" width="24" height="34" class="blk"/><path d="M527 866L543 873L527 880L543 887" class="thin"/><path d="M535 896V906H570" class="line"/><text x="552" y="872" class="tiny">R3</text><text x="552" y="885" class="tiny">10 kΩ</text><path d="M535 851H570" class="line"/><text x="575" y="855" class="tiny">+5V_CTL</text><rect x="570" y="896" width="106" height="20" class="tag"/><text x="623" y="910" text-anchor="middle" class="tiny">START_STOP</text>
<text x="60" y="929" class="tiny">Same-name labels denote electrical continuity. S1 is not an emergency stop.</text>

<!-- E: driver circuit -->
<rect x="710" y="415" width="660" height="520" class="blk"/>
<text x="730" y="445" class="sec">E. RELAY COIL DRIVER (5 V DC)</text><text x="730" y="467" class="sm">Bare relay + logic-level N-MOSFET; not the same as a relay module</text>
<!-- +5 through SW2 NC -->
<text x="742" y="510" class="net">+5V_CTL</text><path d="M810 505H850" class="line"/><circle cx="850" cy="505" r="3" class="dot"/><circle cx="900" cy="505" r="3" class="dot"/><path d="M850 505H900" class="line"/><text x="875" y="490" text-anchor="middle" class="sm">SW2 NC</text><text x="875" y="522" text-anchor="middle" class="tiny">coil inhibit</text><path d="M900 505H945" class="line"/>
<!-- coil -->
<rect x="945" y="485" width="135" height="40" rx="17" class="blk"/><text x="1012" y="510" text-anchor="middle" class="lab">K1 · 5 V coil</text>
<!-- Drain path -->
<path d="M1080 505H1130V620H1230V648" class="line"/><text x="1090" y="493" class="tiny">COIL− / DRAIN</text>
<!-- Flyback branch -->
<path d="M945 505V557H966" class="line"/><path d="M970 545V569" class="line"/><path d="M992 545L992 569L972 557Z" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M992 557H1130V505" class="line"/><text x="1007" y="540" class="sm">D1 1N4007</text><text x="1007" y="576" class="tiny">K → +5V; A → drain</text>
<!-- MOSFET symbol and connections -->
<path d="M1230 648V671" class="line"/><path d="M1213 672V719" class="line"/><path d="M1230 672V719" class="line"/><path d="M1230 719V744" class="line"/><path d="M1195 685H1213" class="line"/><text x="1180" y="679" class="tiny">G</text><text x="1240" y="670" class="tiny">D</text><text x="1240" y="741" class="tiny">S</text>
<path d="M1230 744V767H1320" class="line"/><path d="M1307 767H1333M1311 774H1329M1316 781H1324" class="line"/><text x="1320" y="800" text-anchor="middle" class="sm">GND_CTL</text>
<!-- gate network -->
<rect x="1035" y="670" width="78" height="29" class="blk"/><path d="M1042 675L1106 694M1042 694L1106 675" class="thin"/><text x="1074" y="662" text-anchor="middle" class="sm">Rg 100 Ω</text><path d="M990 685H1035" class="line"/><text x="990" y="670" class="net">UV_RELAY_CMD</text><path d="M1113 685H1195" class="line"/>
<!-- pull-down -->
<path d="M1152 685V720" class="line"/><rect x="1140" y="720" width="24" height="43" class="blk"/><path d="M1144 724L1160 732L1144 740L1160 748L1144 756" class="thin"/><text x="1170" y="738" class="sm">Rpd</text><text x="1170" y="753" class="sm">100 kΩ</text><path d="M1152 763V767H1230" class="line"/>
<text x="730" y="833" class="sm">Current path: +5V_CTL → SW2 NC → K1 coil → Q1 drain/source → GND_CTL.</text><text x="730" y="855" class="sm">D1 is parallel with the coil: cathode at +5 V, anode at drain/coil−.</text><text x="730" y="877" class="sm">Rpd 100 kΩ from gate to source; Q1 needs RDS(on) specified at VGS 4.5–5 V.</text><text x="730" y="899" class="sm">If a verified relay module already includes driver + diode, use it instead of Q1/Rg/Rpd/D1.</text><text x="730" y="921" class="tiny">Check MOSFET pinout and relay coil current against the actual datasheets.</text>

<!-- F: mains functional boundary -->
<rect x="1390" y="415" width="370" height="520" class="blk"/>
<text x="1410" y="445" class="sec">F. UV-C LOAD BLOCK</text><text x="1410" y="467" class="sm">Functional path only, not AC wiring instructions</text>
<rect x="1420" y="500" width="310" height="52" class="blk"/><text x="1575" y="522" text-anchor="middle" class="lab">AC input + protection</text><text x="1575" y="540" text-anchor="middle" class="tiny">ratings TBD</text><path d="M1575 552V575" class="dash"/>
<rect x="1420" y="575" width="310" height="67" class="blk"/><text x="1575" y="598" text-anchor="middle" class="lab">SW3 · mains-rated door interlock</text><text x="1575" y="620" text-anchor="middle" class="sm">must independently cut lamp power</text><path d="M1575 642V666" class="dash"/>
<rect x="1420" y="666" width="310" height="58" class="blk"/><text x="1575" y="690" text-anchor="middle" class="lab">K1 isolated contacts</text><text x="1575" y="709" text-anchor="middle" class="sm">ballast/inrush rating TBD</text><path d="M1575 724V747" class="dash"/>
<rect x="1420" y="747" width="310" height="65" class="blk"/><text x="1575" y="771" text-anchor="middle" class="lab">Matched ballast / driver(s)</text><text x="1575" y="792" text-anchor="middle" class="sm">for actual lamp model</text><path d="M1575 812V835" class="dash"/>
<rect x="1420" y="835" width="310" height="62" class="blk"/><text x="1575" y="859" text-anchor="middle" class="lab">2 × UV-C lamps</text><text x="1575" y="880" text-anchor="middle" class="sm">one relay channel switches both</text>
<text x="1410" y="914" class="tiny">SW3 must still cut power if K1 contacts weld closed.</text>

<!-- G notes and title block -->
<rect x="40" y="955" width="1080" height="235" class="blk"/>
<text x="60" y="985" class="sec">G. CORRECTIONS AND SCOPE</text>
<text x="62" y="1015" class="txt">1. Regulated 5 V input replaces the previous 12 V + LM7805 scheme.</text>
<text x="62" y="1040" class="txt">2. Power LED now has R1 in series; C1/C2 are connected across the control rails.</text>
<text x="62" y="1065" class="txt">3. CH32V003F4P6 is TSSOP-20; exact MCU pin mapping is intentionally not fabricated.</text>
<text x="62" y="1090" class="txt">4. SW1 monitors door, SW2 interrupts relay-coil power, SW3 independently interrupts lamp power.</text>
<text x="62" y="1115" class="txt">5. Heater/fan/solenoid removed from baseline; S1 Start/Stop is included and must be added to BOM.</text>
<text x="62" y="1140" class="txt">6. UV-C source requires an opaque enclosure and validated exposure process. No sterilization claim yet.</text>
<text x="62" y="1170" class="tiny">Not a certified or fabrication-ready design. Do not use as a mains/ballast wiring guide.</text>
<!-- title -->
<rect x="1140" y="955" width="620" height="235" class="blk"/>
<path d="M1140 991H1760M1140 1027H1760M1140 1086H1760M1465 1086V1190" class="thin"/>
<text x="1158" y="979" class="lab">STEM PROJECT</text><text x="1158" y="1015" class="lab">MULTI-PURPOSE STERILIZER UNIT PROTOTYPE</text><text x="1158" y="1047" class="sm">SCHEMATIC DIAGRAM · REV 1.4</text><text x="1158" y="1068" class="sm">DESIGNED BY: Kadal-Stacks</text><text x="1158" y="1110" class="sm">DATE: 2026-10-27</text><text x="1490" y="1110" class="sm">SHEET 1 / 1</text><text x="1158" y="1133" class="tiny">DRAFT · REVIEW COMPONENT RATINGS</text><text x="1158" y="1156" class="tiny">JST-XH pitch: 2.5 mm</text><text x="1158" y="1178" class="tiny">Check all datasheets before assembly.</text>
<text x="900" y="1225" text-anchor="middle" class="sm">Functional net labels connect like-named nets. Confirm connector orientation, MCU package pinout, relay/driver parts and protection with qualified review before build.</text>
</svg>