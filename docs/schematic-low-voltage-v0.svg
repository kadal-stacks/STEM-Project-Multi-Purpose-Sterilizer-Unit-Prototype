<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="t d">
<title id="t">Sterilizer prototype low-voltage schematic draft v0.2</title><desc id="d">5 volt control subsystem, selected MCU, I2C LCD using JST XH four-pin connector, door-status input using two-pin connector, and alternative relay module or discrete MOSFET-driven relay coil. The mains and UV-C circuit is excluded.</desc>
<defs><style>
.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.comp{fill:#fff;stroke:#334155;stroke-width:2}.wire{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.pwr{fill:none;stroke:#c2410c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.sig{fill:none;stroke:#0f766e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.h{font:700 29px Inter,Arial,sans-serif;fill:#0f172a}.sec{font:700 19px Inter,Arial,sans-serif;fill:#0f172a}.lab{font:700 14px Inter,Arial,sans-serif;fill:#0f172a}.tx{font:14px Inter,Arial,sans-serif;fill:#334155}.sm{font:12px Inter,Arial,sans-serif;fill:#475569}.net{font:700 12px Inter,Arial,sans-serif;fill:#0f766e}.hot{font:700 13px Inter,Arial,sans-serif;fill:#9a3412}.dot{fill:#334155}
</style></defs>
<rect width="1600" height="1150" rx="16" class="bg"/>
<text x="48" y="53" class="h">MULTI-PURPOSE STERILIZER UNIT</text>
<text x="50" y="82" class="tx">Low-voltage schematic draft v0.2 · 5 V logic assumption · MCU pin numbers are TBD</text>
<rect x="1240" y="31" width="310" height="44" rx="7" fill="#e0f2fe" stroke="#0284c7"/><text x="1395" y="49" text-anchor="middle" class="lab">ENGINEERING REVIEW DRAFT</text><text x="1395" y="65" text-anchor="middle" class="sm">Not fabrication-ready</text>

<rect x="38" y="110" width="1524" height="365" rx="12" class="panel"/>
<text x="62" y="143" class="sec">A. 5 V LOW-VOLTAGE CONTROL</text>
<text x="62" y="166" class="sm">Use an isolated regulated 5 V DC adapter. Final current rating depends on the selected board, display and relay.</text>

<!-- J1 power -->
<rect x="65" y="200" width="190" height="100" rx="7" class="comp"/>
<text x="160" y="223" text-anchor="middle" class="lab">J1 · JST-XH-2</text><text x="83" y="250" class="tx">1 · +5V_LV</text><text x="83" y="275" class="tx">2 · GND_LV</text>
<path d="M255 245 H320 V190 H1465" class="pwr"/><text x="330" y="183" class="hot">+5V_LV</text>
<path d="M255 275 H295 V440 H1465" class="wire"/><text x="310" y="433" class="lab">GND_LV</text>

<!-- MCU -->
<rect x="345" y="205" width="300" height="205" rx="8" class="comp"/>
<text x="495" y="231" text-anchor="middle" class="lab">U1 · MCU (choose one)</text><text x="495" y="253" text-anchor="middle" class="sm">STC8H1K08 OR CH32V003 at 5 V</text>
<line x1="365" y1="264" x2="625" y2="264" stroke="#94a3b8"/>
<text x="365" y="289" class="tx">VCC ← +5V_LV</text><text x="365" y="313" class="tx">GND → GND_LV</text>
<text x="365" y="341" class="tx">SDA / SCL ↔ LCD</text><text x="365" y="365" class="tx">DOOR_SENSE ← J3</text><text x="365" y="389" class="tx">RELAY_CMD → J4 or Q1</text>
<path d="M495 190 V205" class="pwr"/><path d="M495 410 V440" class="wire"/>
<rect x="355" y="413" width="280" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="495" y="429" text-anchor="middle" class="sm">C1 100 nF close to VCC/GND</text>

<!-- LCD XH4 -->
<rect x="760" y="205" width="300" height="165" rx="8" class="comp"/>
<text x="910" y="231" text-anchor="middle" class="lab">J2 · JST-XH-4 → LCD I²C</text>
<line x1="780" y1="243" x2="1040" y2="243" stroke="#94a3b8"/>
<text x="783" y="270" class="tx">1 · +5V_LV / VCC</text><text x="783" y="294" class="tx">2 · GND_LV / GND</text><text x="783" y="318" class="tx">3 · SDA</text><text x="783" y="342" class="tx">4 · SCL</text>
<path d="M910 190 V205" class="pwr"/><path d="M1010 370 V440" class="wire"/>
<path d="M645 341 H700 V318 H760" class="sig"/><text x="673" y="307" class="net">SDA</text>
<path d="M645 354 H715 V342 H760" class="sig"/><text x="685" y="350" class="net">SCL</text>

<!-- Door input -->
<rect x="1160" y="205" width="340" height="165" rx="8" class="comp"/>
<text x="1330" y="231" text-anchor="middle" class="lab">J3 · JST-XH-2 → DOOR STATUS</text>
<line x1="1180" y1="243" x2="1480" y2="243" stroke="#94a3b8"/>
<text x="1183" y="270" class="tx">1 · DOOR_SENSE</text><text x="1183" y="294" class="tx">2 · GND_LV</text>
<text x="1183" y="323" class="sm">NC contact to GND: closed = LOW;</text><text x="1183" y="340" class="sm">open/broken wire = HIGH fault.</text><text x="1183" y="359" class="sm">R1 10 kΩ pull-up to +5V_LV.</text>
<path d="M1160 270 H1125 V190" class="pwr"/><path d="M1160 294 H1125 V440" class="wire"/>
<path d="M495 365 H680 V383 H1125 V284 H1160" class="sig"/>
<text x="710" y="377" class="net">DOOR_SENSE (pull-up to +5 V)</text>
<text x="62" y="462" class="sm">If a 3.3 V-only MCU board is selected, verify input tolerance and add bidirectional I²C level shifting for a 5 V LCD backpack.</text>

<rect x="38" y="495" width="1524" height="360" rx="12" class="panel"/>
<text x="62" y="529" class="sec">B. RELAY CONTROL · TWO ALTERNATIVES</text>
<text x="62" y="552" class="sm">Choose A or B based on the hardware actually purchased. Do not stack both by default.</text>

<!-- Option A -->
<rect x="65" y="577" width="660" height="240" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="88" y="609" class="lab">OPTION A · 5 V RELAY MODULE</text><text x="88" y="632" class="tx">Module normally includes coil transistor + flyback diode.</text>
<rect x="92" y="657" width="190" height="120" rx="7" class="comp"/>
<text x="187" y="682" text-anchor="middle" class="lab">J4 · JST-XH-3</text><text x="108" y="709" class="tx">1 · +5V_LV</text><text x="108" y="733" class="tx">2 · GND_LV</text><text x="108" y="757" class="tx">3 · RELAY_CMD</text>
<rect x="360" y="657" width="330" height="120" rx="7" class="comp"/>
<text x="525" y="685" text-anchor="middle" class="lab">K1 · RELAY MODULE</text><text x="380" y="711" class="tx">VCC / GND / IN</text><text x="380" y="735" class="tx">Check active HIGH/LOW and</text><text x="380" y="757" class="tx">3.3 V/5 V input compatibility.</text>
<path d="M282 709 H320 V690 H360" class="pwr"/><path d="M282 733 H337 V733 H360" class="wire"/><path d="M282 757 H346 V757 H360" class="sig"/>
<text x="88" y="800" class="sm">No extra MOSFET needed if the relay module’s driver is complete.</text>

<!-- Option B -->
<rect x="750" y="577" width="785" height="240" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="773" y="609" class="lab">OPTION B · BARE RELAY COIL + N-MOSFET Q1</text>
<text x="773" y="632" class="tx">Low-side coil driver; use a genuine logic-level MOSFET and confirm coil current.</text>
<text x="790" y="675" class="hot">+5V_LV</text>
<path d="M850 685 H940" class="pwr"/>
<rect x="940" y="660" width="145" height="50" rx="18" class="comp"/><text x="1012" y="690" text-anchor="middle" class="lab">K1 COIL</text>
<path d="M1085 685 H1165 V729 H1210" class="wire"/>
<!-- Flyback diode parallel across coil, cathode to +5 -->
<path d="M925 685 V645 H1105 V685" class="wire"/>
<polygon points="1000,633 1030,633 1015,656" fill="#fff" stroke="#334155" stroke-width="2"/><line x1="996" y1="633" x2="1034" y2="633" stroke="#334155" stroke-width="3"/>
<text x="1120" y="650" class="sm">D1: 1N400x</text><text x="1120" y="667" class="sm">K → +5V; A → coil−</text>
<rect x="1210" y="707" width="105" height="55" rx="7" class="comp"/><text x="1262" y="731" text-anchor="middle" class="lab">Q1</text><text x="1262" y="749" text-anchor="middle" class="tx">N-MOSFET</text>
<path d="M1262 762 V784 H1410" class="wire"/><text x="1420" y="789" class="lab">GND_LV</text>
<path d="M773 725 H885" class="sig"/><rect x="885" y="706" width="95" height="38" rx="5" class="comp"/><text x="932" y="730" text-anchor="middle" class="tx">Rg 100Ω</text><path d="M980 725 H1168 V735 H1210" class="sig"/>
<path d="M1125 725 V771" class="wire"/><rect x="1103" y="771" width="44" height="25" rx="3" class="comp"/><text x="1125" y="788" text-anchor="middle" class="sm">100k</text><path d="M1125 796 V804 H1262 V784" class="wire"/>
<text x="773" y="790" class="sm">Rg: gate resistor · 100 kΩ gate-to-source pull-down</text>
<text x="773" y="806" class="sm">Example Q1: FQP30N06L TO-220; verify manufacturer datasheet and pinout.</text>

<rect x="38" y="875" width="1524" height="235" rx="12" class="warn"/>
<text x="62" y="911" class="sec" fill="#9a3412">C. UV-C / MAINS SIDE · INTENTIONALLY EXCLUDED FROM WIRING DETAIL</text>
<rect x="70" y="938" width="290" height="66" rx="7" class="comp"/><text x="215" y="965" text-anchor="middle" class="lab">Relay isolated contacts</text><text x="215" y="986" text-anchor="middle" class="tx">low-voltage command only</text>
<path d="M360 971 H440" class="dash"/>
<rect x="440" y="938" width="320" height="66" rx="7" class="comp"/><text x="600" y="965" text-anchor="middle" class="lab">Independent door interlock</text><text x="600" y="986" text-anchor="middle" class="tx">not dependent on MCU firmware</text>
<path d="M760 971 H840" class="dash"/>
<rect x="840" y="938" width="290" height="66" rx="7" class="comp"/><text x="985" y="965" text-anchor="middle" class="lab">Rated lamp ballast/driver</text><text x="985" y="986" text-anchor="middle" class="tx">model not yet selected</text>
<path d="M1130 971 H1210" class="dash"/>
<rect x="1210" y="938" width="290" height="66" rx="7" class="comp"/><text x="1355" y="965" text-anchor="middle" class="lab">UV-C source</text><text x="1355" y="986" text-anchor="middle" class="tx">inside opaque enclosure</text>
<text x="70" y="1033" class="hot">Do not route mains voltage through the matrix board, MCU PCB, or JST-XH low-voltage harness.</text>
<text x="70" y="1058" class="tx">A micro limit switch read by firmware is not, by itself, a safety interlock. UV-C and mains sections require qualified review.</text>
<text x="70" y="1082" class="sm">JST-XH official pitch: 2.5 mm. For LCD I²C use 4-pin XH (VCC, GND, SDA, SCL); XH-2 is for two-wire power/switch signals.</text>
</svg>