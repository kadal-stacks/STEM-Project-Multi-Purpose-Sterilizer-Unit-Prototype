<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 1800 1340" role="img" aria-labelledby="title desc">
<title id="title">Low-voltage control schematic draft for Multi-Purpose Sterilizer Unit Prototype</title>
<desc id="desc">Draft schematic with a five volt isolated low-voltage input, 3.3 volt regulator and MCU, I2C level shifter and four-pin JST-XH LCD connector, two-pin door sensing connector, and two alternative relay driver implementations: a relay module or a bare relay coil switched by a logic-level N-channel MOSFET. Mains and UV-C load circuitry is deliberately excluded from the wiring schematic.</desc>
<defs>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.wire{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.wire5{fill:none;stroke:#c2410c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.wire3{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.signal{fill:none;stroke:#0f766e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:9 7}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.component{fill:#f1f5f9;stroke:#334155;stroke-width:2}.pin{fill:#334155}.title{font:700 32px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.subtitle{font:17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.sect{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.label{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.text{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.small{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.net{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#0f766e}.red{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#9a3412}.gnd{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
  </style>
</defs>
<rect class="bg" width="1800" height="1340" rx="18"/>
<text x="54" y="62" class="title">MULTI-PURPOSE STERILIZER UNIT</text>
<text x="56" y="95" class="subtitle">Draft schematic v0.1 · low-voltage control only · provisional net names, pin mapping not assigned</text>
<rect x="1335" y="38" width="410" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="1540" y="59" text-anchor="middle" class="label" fill="#075985">DESIGN REVIEW DRAFT</text>
<text x="1540" y="77" text-anchor="middle" class="small">Not yet a fabrication-ready schematic</text>

<!-- Power and MCU section -->
<rect class="panel" x="45" y="125" width="1710" height="425" rx="14"/>
<text x="70" y="160" class="sect">A. LOW-VOLTAGE POWER, MCU, LCD AND DOOR INPUT</text>

<!-- J1 input -->
<rect class="component" x="75" y="205" width="200" height="115" rx="8"/>
<text x="175" y="229" text-anchor="middle" class="label">J1 · JST-XH-2</text>
<text x="95" y="257" class="text">1 · +5V_ISO</text>
<text x="95" y="283" class="text">2 · GND_LV</text>
<text x="95" y="305" class="small">5 V SELV adapter only</text>
<circle cx="275" cy="253" r="4" class="pin"/><circle cx="275" cy="282" r="4" class="pin"/>

<!-- +5 rail to regulator -->
<path class="wire5" d="M275 253 H340 V241 H395"/>
<text x="300" y="239" class="net">+5V_ISO</text>
<path class="wire" d="M275 282 H340 V306 H395"/>
<text x="295" y="325" class="gnd">GND_LV</text>

<!-- Regulator -->
<rect class="component" x="395" y="198" width="205" height="135" rx="8"/>
<text x="497" y="222" text-anchor="middle" class="label">U1 · 3V3 REGULATOR</text>
<text x="415" y="248" class="text">IN  ← +5V_ISO</text>
<text x="415" y="275" class="text">OUT → +3V3_LOGIC</text>
<text x="415" y="302" class="text">GND → GND_LV</text>
<circle cx="395" cy="241" r="4" class="pin"/><circle cx="600" cy="275" r="4" class="pin"/><circle cx="497" cy="333" r="4" class="pin"/>
<path class="wire3" d="M600 275 H650 V236 H690"/>
<text x="610" y="260" class="net">+3V3_LOGIC</text>
<path class="wire" d="M497 333 V356 H340 V306"/>
<!-- decoupling note -->
<rect x="395" y="365" width="205" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
<text x="497" y="388" text-anchor="middle" class="text">C1/C2: per regulator</text>
<text x="497" y="408" text-anchor="middle" class="small">datasheet + local 100 nF</text>

<!-- MCU -->
<rect class="component" x="690" y="190" width="250" height="245" rx="10"/>
<text x="815" y="218" text-anchor="middle" class="label">U2 · MCU</text>
<text x="815" y="240" text-anchor="middle" class="small">Choose ONE device</text>
<line x1="715" y1="252" x2="915" y2="252" stroke="#94a3b8"/>
<text x="710" y="276" class="text">STC8H1K08 @ 3.3 V</text>
<text x="710" y="298" class="text">OR CH32V003 @ 3.3 V</text>
<text x="710" y="328" class="text">GPIO_I2C_SDA</text>
<text x="710" y="351" class="text">GPIO_I2C_SCL</text>
<text x="710" y="374" class="text">GPIO_DOOR_SENSE</text>
<text x="710" y="397" class="text">GPIO_RELAY_CMD</text>
<text x="710" y="420" class="small">MCU pin numbers: TBD</text>
<path class="wire3" d="M690 236 H650"/>
<text x="644" y="221" text-anchor="middle" class="small">3V3</text>
<path class="wire" d="M815 435 V462 H497 V425"/>
<text x="830" y="455" class="gnd">GND_LV</text>

<!-- I2C level shifter -->
<rect class="component" x="1010" y="193" width="210" height="210" rx="8"/>
<text x="1115" y="218" text-anchor="middle" class="label">U3 · I2C LEVEL SHIFTER</text>
<text x="1030" y="250" class="text">LV = +3V3_LOGIC</text>
<text x="1030" y="278" class="text">HV = +5V_ISO</text>
<text x="1030" y="311" class="text">SDA_LV ↔ SDA_HV</text>
<text x="1030" y="337" class="text">SCL_LV ↔ SCL_HV</text>
<text x="1030" y="369" class="small">Use bidirectional I2C</text>
<text x="1030" y="387" class="small">shifter; check pull-ups</text>
<path class="signal" d="M940 328 H978 V311 H1010"/>
<path class="signal" d="M940 351 H988 V337 H1010"/>
<text x="948" y="301" class="net">SDA_3V3</text>
<text x="948" y="324" class="net">SCL_3V3</text>

<!-- LCD connector -->
<rect class="component" x="1325" y="193" width="300" height="210" rx="8"/>
<text x="1475" y="218" text-anchor="middle" class="label">J2 · JST-XH-4 → LCD 16×2 I2C</text>
<line x1="1345" y1="232" x2="1605" y2="232" stroke="#94a3b8"/>
<text x="1348" y="259" class="text">Pin 1 · GND_LV</text>
<text x="1348" y="286" class="text">Pin 2 · +5V_ISO</text>
<text x="1348" y="313" class="text">Pin 3 · SDA_5V</text>
<text x="1348" y="340" class="text">Pin 4 · SCL_5V</text>
<text x="1348" y="374" class="small">This is the chosen harness</text>
<text x="1348" y="390" class="small">pinout; label both ends.</text>
<path class="signal" d="M1220 311 H1260 V313 H1325"/>
<path class="signal" d="M1220 337 H1270 V340 H1325"/>
<text x="1230" y="298" class="net">SDA_5V</text>
<text x="1230" y="325" class="net">SCL_5V</text>
<path class="wire5" d="M1280 286 H1325"/>
<path class="wire" d="M1280 259 H1300 V430 H1475 V403"/>
<text x="1288" y="277" class="small">+5V</text>
<text x="1488" y="424" class="gnd">GND</text>

<!-- Door sense -->
<rect class="component" x="690" y="465" width="365" height="65" rx="8"/>
<text x="708" y="489" class="label">J3 · JST-XH-2 · DOOR SENSE ONLY</text>
<text x="708" y="512" class="text">1 · DOOR_SENSE / 2 · GND_LV</text>
<path class="signal" d="M815 397 V447 H850 V465"/>
<rect x="1075" y="458" width="335" height="78" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="1092" y="482" class="label">Input behavior (to verify)</text>
<text x="1092" y="505" class="text">Pull-up 10 kΩ to 3V3; contact</text>
<text x="1092" y="524" class="text">pulls low when door is closed.</text>
<text x="1410" y="499" class="small">Cable break → HIGH/fault</text>
<text x="1410" y="518" class="small">if configured as specified.</text>

<!-- Relay options section -->
<rect class="panel" x="45" y="575" width="1710" height="415" rx="14"/>
<text x="70" y="610" class="sect">B. RELAY CONTROL — SELECT ONE IMPLEMENTATION, DO NOT STACK BOTH BY DEFAULT</text>

<!-- Option A -->
<rect x="75" y="642" width="630" height="300" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="100" y="676" class="label">OPTION A · 5 V RELAY MODULE</text>
<text x="100" y="702" class="text">Use if the purchased module already includes a coil driver</text>
<text x="100" y="723" class="text">transistor/MOSFET and flyback diode.</text>
<rect x="112" y="756" width="200" height="100" rx="8" class="component"/>
<text x="212" y="783" text-anchor="middle" class="label">J4 · JST-XH-3</text>
<text x="130" y="808" class="text">1 · +5V_ISO</text>
<text x="130" y="829" class="text">2 · GND_LV</text>
<text x="130" y="850" class="text">3 · RELAY_IN</text>
<rect x="405" y="756" width="260" height="100" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="535" y="783" text-anchor="middle" class="label">K1 RELAY MODULE</text>
<text x="535" y="808" text-anchor="middle" class="text">Check input active HIGH/LOW</text>
<text x="535" y="831" text-anchor="middle" class="text">and 3.3 V logic compatibility</text>
<path class="signal" d="M940 397 V631 H350 V806 H405"/>
<text x="715" y="619" class="net">RELAY_CMD</text>
<path class="wire5" d="M312 790 H360 V770 H405"/>
<path class="wire" d="M312 817 H372 V831 H405"/>
<text x="100" y="887" class="small">Do not add external Q1 unless the module interface</text>
<text x="100" y="905" class="small">requires a level/drive buffer. Verify the actual board.</text>
<text x="100" y="925" class="small">Relay contact terminals belong in a separate load enclosure.</text>

<!-- Option B discrete relay driver -->
<rect x="745" y="642" width="980" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="770" y="676" class="label">OPTION B · BARE 5 V RELAY COIL + LOGIC-LEVEL N-MOSFET</text>
<text x="770" y="702" class="text">Use instead of a relay module, if coil current and MOSFET ratings are verified.</text>
<text x="790" y="759" class="text">+5V_ISO</text>
<path class="wire5" d="M800 775 H1100"/>
<!-- Coil as rectangular symbol -->
<rect x="1000" y="747" width="118" height="56" rx="20" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="1059" y="780" text-anchor="middle" class="label">K1 COIL</text>
<path class="wire5" d="M1100 775 H1210 V843"/>
<text x="1118" y="760" class="small">D1 across coil</text>
<!-- Flyback diode to right in a clear parallel branch -->
<path class="wire" d="M970 775 V822 H1210 V775"/>
<path class="wire" d="M1188 775 H1210 V843"/>
<polygon points="1194,790 1226,790 1210,814" fill="#fff" stroke="#334155" stroke-width="2"/>
<line x1="1192" y1="789" x2="1228" y2="789" stroke="#334155" stroke-width="3"/>
<text x="1237" y="798" class="small">Cathode → +5V</text>
<text x="1237" y="816" class="small">Anode → coil−</text>
<!-- MOSFET -->
<path class="wire" d="M1210 843 V871 H1340"/>
<rect x="1340" y="834" width="92" height="80" rx="6" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="1386" y="861" text-anchor="middle" class="label">Q1</text>
<text x="1386" y="881" text-anchor="middle" class="small">N-MOSFET</text>
<text x="1386" y="899" text-anchor="middle" class="small">logic level</text>
<path class="wire" d="M1386 914 V925 H1515"/>
<text x="1524" y="929" class="gnd">GND_LV</text>
<!-- gate -->
<path class="signal" d="M940 397 V654 H880 V804"/>
<rect x="865" y="804" width="30" height="50" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="880" y="834" text-anchor="middle" class="small">Rg</text>
<text x="855" y="792" class="small">100 Ω</text>
<path class="signal" d="M895 829 H1250 V873 H1340"/>
<text x="1080" y="852" class="net">GATE</text>
<!-- pulldown -->
<path class="wire" d="M1240 873 V907"/>
<rect x="1220" y="907" width="40" height="24" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="1240" y="923" text-anchor="middle" class="small">Rpd</text>
<path class="wire" d="M1240 931 V950 H1340 V925"/>
<text x="1268" y="925" class="small">100 kΩ to GND</text>
<text x="770" y="926" class="small">Rpd keeps Q1 OFF during reset; confirm gate drive, RDS(on),</text>
<text x="770" y="941" class="small">VDS, coil current and thermal margin against chosen datasheets.</text>

<!-- Load safety boundary -->
<rect class="warn" x="45" y="1015" width="1710" height="270" rx="14"/>
<text x="72" y="1052" class="sect" fill="#9a3412">C. UV-C / MAINS SUBSYSTEM — INTENTIONALLY NOT DRAWN AS A WIRING SCHEMATIC</text>
<text x="78" y="1090" class="text">Low-voltage relay command / isolated relay contact</text>
<path class="dash" d="M78 1112 H670"/>
<rect x="700" y="1070" width="250" height="86" rx="8" fill="#fff" stroke="#c2410c" stroke-width="2"/>
<text x="825" y="1102" text-anchor="middle" class="label">Independent safety</text>
<text x="825" y="1125" text-anchor="middle" class="label">door interlock / cutoff</text>
<path class="dash" d="M950 1112 H1025"/>
<rect x="1025" y="1070" width="245" height="86" rx="8" fill="#fff" stroke="#c2410c" stroke-width="2"/>
<text x="1147" y="1102" text-anchor="middle" class="label">Correct lamp ballast</text>
<text x="1147" y="1125" text-anchor="middle" class="label">or rated driver</text>
<path class="dash" d="M1270 1112 H1345"/>
<rect x="1345" y="1070" width="285" height="86" rx="8" fill="#fff" stroke="#c2410c" stroke-width="2"/>
<text x="1487" y="1102" text-anchor="middle" class="label">Verified UV-C source</text>
<text x="1487" y="1125" text-anchor="middle" class="label">inside opaque enclosure</text>
<text x="78" y="1190" class="red">Do not route mains voltage through the low-voltage matrix board or generic JST harness.</text>
<text x="78" y="1217" class="text">Use an independently engineered, enclosed and reviewed mains subsystem. MCU firmware and a cheap relay module alone are not a safety interlock.</text>
<text x="78" y="1245" class="text">UV-C can injure eyes/skin; keep source enclosed and verify shutoff behavior before any powered test.</text>
<text x="78" y="1271" class="small">References: JST XH connector specs · STC/WCH MCU docs · CDC/NIOSH GUV safety guidance. See accompanying Markdown for links and pinout notes.</text>
</svg>